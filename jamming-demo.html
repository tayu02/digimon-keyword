<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ジャミング</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .enemy-area{
    display:flex;justify-content:center;align-items:flex-start;gap:40px;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}
  .my-area{display:flex;justify-content:center;padding:10px 0 4px}

  /* カードスロット */
  .slot{
    width:108px;height:151px;
    position:relative;flex:0 0 auto;
  }
  .card{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease, opacity .3s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}

  /* セキュリティエリア */
  .security-slot{
    width:108px;height:180px;
    position:relative;flex:0 0 auto;
  }
  /* 裏向きカード3枚をズラして重ねる */
  .sec-card{
    position:absolute;
    width:108px;height:151px;
    left:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 8px 16px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:transform .4s ease, opacity .3s ease, box-shadow .3s ease;
  }
  .sec-card img{width:100%;height:100%;object-fit:cover;display:block}
  /* 下から順に */
  #sec3{ top:20px; z-index:1; filter:brightness(.7); }
  #sec2{ top:10px; z-index:2; filter:brightness(.85); }
  #sec1{ top:0px;  z-index:3; } /* 一番上・めくれる対象 */

  /* オグドモン（めくれた後表示） */
  #ogdCard{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    z-index:4;
    opacity:0;
    transform-origin:center center;
  }
  #ogdCard img{width:100%;height:100%;object-fit:cover;display:block;transform:rotate(180deg)}

  /* 矢印SVG */
  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* ジャミングエフェクト（緑） */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(80,255,140,.2) 0%,rgba(80,255,140,.08) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(80,255,140,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(28px,8vw,46px);font-weight:900;
    letter-spacing:.12em;color:#fff;
    text-shadow:0 0 24px rgba(80,255,140,1),0 0 48px rgba(80,255,140,.8),0 0 80px rgba(80,255,140,.5),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }

  /* カードめくりアニメ */
  @keyframes flip{
    0%  {transform:rotateY(0deg)}
    50% {transform:rotateY(90deg)}
    100%{transform:rotateY(0deg)}
  }
  /* fallしかけて戻る */
  @keyframes fallAndReturn{
    0%  {transform:translateY(0);opacity:1;filter:none}
    35% {transform:translateY(40px) scale(.9);opacity:.4;filter:blur(2px)}
    60% {transform:translateY(40px) scale(.9);opacity:.4;filter:blur(2px)}
    100%{transform:translateY(0);opacity:1;filter:none}
  }
  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowGreen{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(80,255,140,.65),0 0 42px rgba(80,255,140,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(80,255,140,.9) ,0 0 58px rgba(80,255,140,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }

  .inline-log{
    margin-top:10px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">ジャミング</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア -->
    <div class="area-label">相手のバトルエリア</div>
    <div class="enemy-area">

      <!-- セキュリティエリア（裏向き3枚） -->
      <div>
        <div class="area-label" style="text-align:center">セキュリティ</div>
        <div class="security-slot">
          <div class="sec-card" id="sec3">
            <img src="https://tayu02.github.io/digimon-keyword/digimon/uragawa.jpeg" alt="">
          </div>
          <div class="sec-card" id="sec2">
            <img src="https://tayu02.github.io/digimon-keyword/digimon/uragawa.jpeg" alt="">
          </div>
          <div class="sec-card" id="sec1">
            <img src="https://tayu02.github.io/digimon-keyword/digimon/uragawa.jpeg" alt="">
          </div>
          <!-- オグドモン（めくれた後） -->
          <div id="ogdCard">
            <img src="https://tayu02.github.io/digimon-keyword/digimon/EX6-073.png" alt="">
          </div>
        </div>
      </div>

    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="slot">
        <div class="card" id="ravenCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX4-058.png" alt="">
        </div>
      </div>
    </div>

    <!-- 矢印SVG -->
    <svg class="arrow-layer" id="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="mhG" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(255,214,106,.92)"/>
        </marker>
      </defs>
      <!-- レイヴモン→相手プレイヤー（上向き・点線） -->
      <line id="arrPlayer"
        stroke="rgba(255,214,106,.88)" stroke-width="1.1" stroke-dasharray="3.5 2.5"
        marker-end="url(#mhG)" opacity="0" style="transition:opacity .3s ease"/>
    </svg>

    <!-- ジャミングエフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">ジャミング</div>
      <div class="fx-sub"  id="fxSub">JAMMING</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        アタック宣言 → セキュリティチェック → DP負け演出 → ジャミング発動 → 消滅せず1チェック完了
      </div>
    </div>
  </div>

</div></div>

<script>
const board     = document.getElementById("board");
const ravenCard = document.getElementById("ravenCard");
const sec1      = document.getElementById("sec1");
const sec2      = document.getElementById("sec2");
const sec3      = document.getElementById("sec3");
const ogdCard   = document.getElementById("ogdCard");
const arrPlayer = document.getElementById("arrPlayer");
const fxOverlay = document.getElementById("fxOverlay");
const fxBg      = document.getElementById("fxBg");
const fxRing    = document.getElementById("fxRing");
const fxWord    = document.getElementById("fxWord");
const fxSub     = document.getElementById("fxSub");
const infoBox   = document.getElementById("infoBox");
const infoTitle = document.getElementById("infoTitle");
const infoText  = document.getElementById("infoText");
const nextBtn   = document.getElementById("nextBtn");
const prevBtn   = document.getElementById("prevBtn");
const playBtn   = document.getElementById("playBtn");
const resetBtn  = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 4;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const RAVEN_REST = "translateY(-22px) rotate(90deg)";
const GOLD  = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const GREEN = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(80,255,140,.7),0 0 44px rgba(80,255,140,.35),0 10px 20px rgba(0,0,0,.42)";
const RED   = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";

const steps = [
  { title:"① 初期状態",
    text :"レイヴモンがアクティブでバトルエリアにいます。相手のセキュリティは3枚です。" },
  { title:"② アタック宣言",
    text :"レイヴモンがアタックを宣言し、レスト状態になりました。対象は相手プレイヤーへの直接攻撃です。セキュリティチェックが発生します。" },
  { title:"③ セキュリティチェック・DP負け",
    text :"セキュリティの一番上のカードをめくります。オグドモンが登場しました。DPはオグドモンの方が高く、通常ならレイヴモンは消滅してしまいます。" },
  { title:"④ ジャミング発動",
    text :"ジャミングが発動します。ジャミングを持つデジモンはセキュリティバトルで負けても消滅しません。レイヴモンは生き残り、セキュリティを1枚チェックしました。" },
];

// 矢印座標をDOMから動的計算
function updateArrows() {
  const br = board.getBoundingClientRect();
  const rr = ravenCard.getBoundingClientRect();
  const rx = ((rr.left + rr.width  / 2) - br.left) / br.width  * 100;
  const ry = ((rr.top  + rr.height / 2) - br.top)  / br.height * 100;
  arrPlayer.setAttribute("x1", rx);
  arrPlayer.setAttribute("y1", ry);
  arrPlayer.setAttribute("x2", rx);
  arrPlayer.setAttribute("y2", 3);
}

function resetAll() {
  ravenCard.style.transform = "";
  ravenCard.style.animation = "none";
  ravenCard.style.boxShadow = "";
  ravenCard.style.filter    = "none";
  ravenCard.style.opacity   = "1";
  sec1.style.opacity  = "1"; sec1.style.top = "0px";
  sec2.style.opacity  = "1"; sec2.style.top = "10px";
  sec3.style.opacity  = "1"; sec3.style.top = "20px";
  sec1.style.animation = "none";
  ogdCard.style.opacity   = "0";
  ogdCard.style.animation = "none";
  ogdCard.style.boxShadow = "";
  arrPlayer.style.opacity = "0";
  fxOverlay.style.opacity = "0";
}

const S = [
  // 0: 初期状態
  () => {
    resetAll();
    ravenCard.style.animation = "glowGold 1.4s ease infinite";
    ravenCard.style.boxShadow = GOLD;
  },
  // 1: レスト・矢印→プレイヤー
  () => {
    resetAll();
    ravenCard.style.transform = RAVEN_REST;
    ravenCard.style.animation = "glowGold 1.4s ease infinite";
    ravenCard.style.boxShadow = GOLD;
    requestAnimationFrame(() => { updateArrows(); arrPlayer.style.opacity = "1"; });
  },
  // 2: オグドモンが捲れた状態・レイヴモンが赤く光る（DP負け）
  () => {
    resetAll();
    ravenCard.style.transform = RAVEN_REST;
    ravenCard.style.animation = "glowRed 1.4s ease infinite";
    ravenCard.style.boxShadow = RED;
    sec1.style.opacity = "0";
    ogdCard.style.opacity = "1";
    ogdCard.style.animation = "glowRed 1.4s ease infinite";
    ogdCard.style.boxShadow = RED;
    requestAnimationFrame(() => { updateArrows(); arrPlayer.style.opacity = "1"; });
  },
  // 3: ジャミング発動・レイヴモン緑に光る・セキュリティ1枚減
  () => {
    resetAll();
    ravenCard.style.transform = RAVEN_REST;
    ravenCard.style.animation = "glowGreen 1.4s ease infinite";
    ravenCard.style.boxShadow = GREEN;
    sec1.style.opacity = "0";
    ogdCard.style.opacity  = "0";
    // セキュリティ2枚に
    sec2.style.top = "0px";
    sec3.style.top = "10px";
    requestAnimationFrame(() => { updateArrows(); arrPlayer.style.opacity = "1"; });
  },
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // レスト回転→矢印
    ravenCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    ravenCard.style.transform  = RAVEN_REST;
    await sleep(520);
    ravenCard.style.transition = "";
    requestAnimationFrame(() => { updateArrows(); arrPlayer.style.opacity = "1"; });
    S[1](); return;
  }

  if (step === 2) {
    // sec1がめくれてオグドモン表示
    sec1.style.transition = "opacity .3s ease";
    sec1.style.opacity    = "0";
    await sleep(200);
    ogdCard.style.opacity   = "1";
    ogdCard.style.animation = "blink .6s linear 1";
    await sleep(620);
    // fallしかけて戻る
    ravenCard.style.animation = "fallAndReturn 1.2s ease forwards";
    ravenCard.style.boxShadow = RED;
    ogdCard.style.animation   = "glowRed 1.4s ease infinite";
    ogdCard.style.boxShadow   = RED;
    await sleep(1200);
    S[2](); return;
  }

  if (step === 3) {
    // ジャミングエフェクト→緑に変わる→オグドモン消える→セキュリティ1枚減
    await playFx();
    ravenCard.style.animation = "glowGreen 1.4s ease infinite";
    ravenCard.style.boxShadow = GREEN;
    ogdCard.style.transition  = "opacity .4s ease";
    ogdCard.style.opacity     = "0";
    await sleep(420);
    sec2.style.transition = "top .4s ease";
    sec3.style.transition = "top .4s ease";
    sec2.style.top = "0px";
    sec3.style.top = "10px";
    await sleep(420);
    sec2.style.transition = "";
    sec3.style.transition = "";
    S[3](); return;
  }
}

async function goTo(step, instant = false) {
  cur = step; updateText(); updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  if (locked || cur >= TOTAL - 1) return;
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  if (locked || playing || cur >= TOTAL - 1) return;
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800); if (!playing) break;
    locked = true; await goTo(cur + 1, false); locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

window.addEventListener("resize", () => { if (cur >= 1) updateArrows(); });
goTo(0, true);
</script>
</body>
</html>
