<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>氷装</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .enemy-area{
    display:flex;justify-content:center;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}
  .my-area{display:flex;justify-content:center;padding:10px 0 4px}

  /* スタック用スロット：進化元が多いので縦に余裕を持たせる */
  .slot{
    width:108px;
    height:200px;
    position:relative;flex:0 0 auto;
  }

  .card{
    position:absolute;
    width:108px;
    height:151px; /* 108*(88/63) */
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease, opacity .3s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .enemy .card img{transform:rotate(180deg)}

  /* 進化元カードは少しずつずらして重ねる */
  /* ヒヤリモン(最下)→ブルコモン→ペイルドラモン→クリスタルベイルドラモン→ヘクセブラウモン(最上) */

  /* 進化元枚数バッジ */
  .evo-badge{
    position:absolute;
    bottom:-8px;left:50%;transform:translateX(-50%);
    background:rgba(10,20,40,.9);
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    padding:3px 10px;
    font-size:11px;font-weight:700;
    color:var(--text);
    white-space:nowrap;
    z-index:30;
    opacity:0;
    transition:opacity .3s ease;
  }

  /* 矢印SVG */
  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* 氷装エフェクト（水色） */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(100,220,255,.2) 0%,rgba(100,220,255,.08) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(130,230,255,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(28px,8vw,46px);font-weight:900;
    letter-spacing:.12em;color:#fff;
    text-shadow:0 0 24px rgba(130,230,255,1),0 0 48px rgba(130,230,255,.8),0 0 80px rgba(130,230,255,.5),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }

  @keyframes glowCyan{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(130,230,255,.65),0 0 42px rgba(130,230,255,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(130,230,255,.9) ,0 0 58px rgba(130,230,255,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }
  @keyframes fall{
    0%{opacity:1;filter:none}
    40%{opacity:.5}
    100%{transform:translateY(60px) scale(.82);opacity:0;filter:blur(3px)}
  }
  @keyframes fallRest{
    0%{opacity:1;filter:none;transform:translateY(-22px) rotate(90deg)}
    40%{opacity:.5}
    100%{transform:translateY(38px) rotate(90deg) scale(.82);opacity:0;filter:blur(3px)}
  }

  .inline-log{
    margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">氷装</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア -->
    <div class="area-label">相手のバトルエリア</div>
    <div class="enemy-area">
      <div class="slot enemy" style="height:151px">
        <div class="card" id="volcCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-014.png" alt="">
        </div>
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="slot" id="mySlot">
        <!-- 進化元（下から順に：ヒヤリモン→ブルコモン→ペイルドラモン→クリスタルベイルドラモン） -->
        <!-- 各カードを少しずつ上にずらしてスタック表現 -->
        <div class="card" id="hiyaCard" style="transform:translateY(42px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-002.png" alt="">
        </div>
        <div class="card" id="bulkCard" style="transform:translateY(28px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-016.png" alt="">
        </div>
        <div class="card" id="paleCard" style="transform:translateY(14px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-020.png" alt="">
        </div>
        <div class="card" id="crystCard" style="transform:translateY(0px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-021.png" alt="">
        </div>
        <!-- ヘクセブラウモン（最上・進化先） -->
        <div class="card" id="hexeCard" style="transform:translateY(-14px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-023.png" alt="">
        </div>
        <!-- 進化元枚数バッジ -->
        <div class="evo-badge" id="evoBadge">進化元 4枚</div>
      </div>
    </div>

    <!-- 矢印SVG -->
    <svg class="arrow-layer" id="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="mhC" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(130,230,255,.92)"/>
        </marker>
      </defs>
      <line id="arrVolc"
        stroke="rgba(130,230,255,.88)" stroke-width="1.4"
        marker-end="url(#mhC)" opacity="0" style="transition:opacity .3s ease"/>
    </svg>

    <!-- 氷装エフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">氷装</div>
      <div class="fx-sub"  id="fxSub">ICE ARMOR</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        アタック → 氷装発動 → DP負け演出 → 実際は進化元枚数で勝負 → バトル勝利
      </div>
    </div>
  </div>

</div></div>

<script>
const board    = document.getElementById("board");
const volcCard = document.getElementById("volcCard");
const hexeCard = document.getElementById("hexeCard");
const crystCard= document.getElementById("crystCard");
const paleCard = document.getElementById("paleCard");
const bulkCard = document.getElementById("bulkCard");
const hiyaCard = document.getElementById("hiyaCard");
const evoBadge = document.getElementById("evoBadge");
const arrVolc  = document.getElementById("arrVolc");
const fxOverlay= document.getElementById("fxOverlay");
const fxBg     = document.getElementById("fxBg");
const fxRing   = document.getElementById("fxRing");
const fxWord   = document.getElementById("fxWord");
const fxSub    = document.getElementById("fxSub");
const infoBox  = document.getElementById("infoBox");
const infoTitle= document.getElementById("infoTitle");
const infoText = document.getElementById("infoText");
const nextBtn  = document.getElementById("nextBtn");
const prevBtn  = document.getElementById("prevBtn");
const playBtn  = document.getElementById("playBtn");
const resetBtn = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 6;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// カードの定位置（スタック表現）
const POS = {
  hiya : "translateY(42px)",
  bulk : "translateY(28px)",
  pale : "translateY(14px)",
  cryst: "translateY(0px)",
  hexe : "translateY(-14px)",
  hexeRest: "translateY(-46px) rotate(90deg)",
};

const CYAN = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(130,230,255,.7),0 0 44px rgba(130,230,255,.35),0 10px 20px rgba(0,0,0,.42)";
const GOLD = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const RED  = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";

const steps = [
  { title:"① 初期状態",
    text :"ヘクセブラウモンがバトルエリアにいます。進化元には4枚のデジモンがいます。相手のバトルエリアにはヴォルカニックドラモンがレスト状態です。" },
  { title:"② アタック宣言",
    text :"氷装を持つヘクセブラウモンが、自分よりDPが高いヴォルカニックドラモンへアタックを宣言します。" },
  { title:"③ 通常ならDP負け",
    text :"通常のバトルルールではDPが低い方のデジモンが消滅します。ヘクセブラウモンはDP負けして消滅してしまいます。" },
  { title:"④ 氷装：進化元枚数で勝負",
    text :"しかし氷装発動！氷装を持つデジモンとのバトルはDPが関係なくなり、代わりに進化元の枚数で勝負します。" },
  { title:"⑤ アタック時効果・バトル",
    text :"アタック時効果・カウンター・ブロックのタイミングを経てバトルとなります。" },
  { title:"⑥ 勝利",
    text :"自分の進化元は4枚、相手の進化元は0枚。枚数で上回る自分の勝利です。ヴォルカニックドラモンが消滅します。" },
];

// 矢印座標をDOMから動的計算
function updateArrows() {
  const br = board.getBoundingClientRect();
  const hr = hexeCard.getBoundingClientRect();
  const vr = volcCard.getBoundingClientRect();
  const hx = ((hr.left + hr.width  / 2) - br.left) / br.width  * 100;
  const hy = ((hr.top  + hr.height / 2) - br.top)  / br.height * 100;
  const vx = ((vr.left + vr.width  / 2) - br.left) / br.width  * 100;
  const vy = ((vr.top  + vr.height / 2) - br.top)  / br.height * 100;
  arrVolc.setAttribute("x1", hx); arrVolc.setAttribute("y1", hy);
  arrVolc.setAttribute("x2", vx); arrVolc.setAttribute("y2", vy);
}

// カードスタックをリセット
function resetStack() {
  hiyaCard.style.transform  = POS.hiya;  hiyaCard.style.opacity = "1";
  bulkCard.style.transform  = POS.bulk;  bulkCard.style.opacity = "1";
  paleCard.style.transform  = POS.pale;  paleCard.style.opacity = "1";
  crystCard.style.transform = POS.cryst; crystCard.style.opacity = "1";
  hexeCard.style.transform  = POS.hexe;  hexeCard.style.opacity = "1";
  [hiyaCard,bulkCard,paleCard,crystCard,hexeCard].forEach(c => {
    c.style.animation = "none"; c.style.boxShadow = ""; c.style.filter = "none";
  });
}

// 全状態リセット
function applyState({ hexeT, hexeA, hexeSh, volcA, volcSh, volcV, showArr, showBadge } = {}) {
  resetStack();
  hexeCard.style.transform = hexeT  || POS.hexe;
  hexeCard.style.animation = hexeA  || "none";
  hexeCard.style.boxShadow = hexeSh || "";
  volcCard.style.opacity   = volcV  === false ? "0" : "1";
  volcCard.style.animation = volcA  || "none";
  volcCard.style.boxShadow = volcSh || "";
  volcCard.style.filter    = "none";
  volcCard.style.transform = "rotate(-90deg)"; // 相手レスト
  fxOverlay.style.opacity  = "0";
  evoBadge.style.opacity   = showBadge ? "1" : "0";
  if (showArr) {
    requestAnimationFrame(() => { updateArrows(); arrVolc.style.opacity = "1"; });
  } else {
    arrVolc.style.opacity = "0";
  }
}

const S = [
  // 0: 初期状態
  () => applyState({ hexeA:"glowGold 1.4s ease infinite", hexeSh:GOLD }),
  // 1: ヘクセブラウモンがレスト・矢印→ヴォルカニックドラモン
  () => applyState({ hexeT:POS.hexeRest, hexeA:"glowCyan 1.4s ease infinite", hexeSh:CYAN, showArr:true }),
  // 2: ヘクセブラウモンが消滅（DP負け演出）→進化元も全て消える
  () => {
    volcCard.style.transform = "rotate(-90deg)";
    volcCard.style.opacity   = "1";
    [hexeCard,crystCard,paleCard,bulkCard,hiyaCard].forEach(c => {
      c.style.opacity = "0";
    });
    arrVolc.style.opacity   = "0";
    evoBadge.style.opacity  = "0";
    fxOverlay.style.opacity = "0";
  },
  // 3: 盤面を元に戻して氷装エフェクト・バッジ表示
  () => applyState({ hexeT:POS.hexeRest, hexeA:"glowCyan 1.4s ease infinite", hexeSh:CYAN, showArr:true, showBadge:true }),
  // 4: アタック時効果（ヘクセブラウモン点滅）
  () => applyState({ hexeT:POS.hexeRest, hexeA:"glowCyan 1.4s ease infinite", hexeSh:CYAN, showArr:true, showBadge:true }),
  // 5: ヴォルカニックドラモンだけ消滅・スタックは残る
  () => applyState({ hexeT:POS.hexeRest, hexeA:"glowCyan 1.4s ease infinite", hexeSh:CYAN, showBadge:true }),
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // ヘクセブラウモンがレスト回転→矢印
    hexeCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    hexeCard.style.transform  = POS.hexeRest;
    await sleep(520);
    hexeCard.style.transition = "";
    S[1]();
    return;
  }

  if (step === 2) {
    // DP負け：全スタックがfallで消える
    [hexeCard,crystCard,paleCard,bulkCard,hiyaCard].forEach(c => {
      c.style.animation = "fall .6s ease forwards";
    });
    await sleep(650);
    S[2]();
    return;
  }

  if (step === 3) {
    // 盤面を元に戻して氷装エフェクト
    S[3]();
    await sleep(300);
    await playFx();
    return;
  }

  if (step === 4) {
    // アタック時効果：ヘクセブラウモン点滅
    hexeCard.style.animation = "blink .8s linear 1";
    hexeCard.style.boxShadow = CYAN;
    await sleep(820);
    S[4]();
    return;
  }

  if (step === 5) {
    // ヴォルカニックドラモンだけ点滅→消滅（スタックは残る）
    volcCard.style.animation = "blink .8s linear 1";
    volcCard.style.boxShadow = RED;
    await sleep(820);
    volcCard.style.animation = "fallRest .5s ease forwards";
    await sleep(520);
    S[5]();
    return;
  }
}

async function goTo(step, instant = false) {
  cur = step;
  updateText();
  updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || cur >= TOTAL - 1) return;
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || playing || cur >= TOTAL - 1) return;
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800);
    if (!playing) break;
    locked = true;
    await goTo(cur + 1, false);
    locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

window.addEventListener("resize", () => { if (cur >= 1 && cur !== 2) updateArrows(); });
goTo(0, true);
</script>
