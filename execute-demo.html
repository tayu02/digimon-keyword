<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>エグゼキュート</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .enemy-area{
    display:flex;justify-content:center;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}
  .my-area{display:flex;justify-content:center;padding:10px 0 4px}

  .slot{
    width:108px;height:151px;
    position:relative;flex:0 0 auto;
  }
  .card{
    position:absolute;inset:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease, opacity .3s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .enemy .card img{transform:rotate(180deg)}

  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* エグゼキュートエフェクト（紫・暗め） */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(100,0,180,.25) 0%,rgba(100,0,180,.1) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(160,60,255,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(24px,7vw,42px);font-weight:900;
    letter-spacing:.08em;color:#fff;
    text-shadow:0 0 24px rgba(160,60,255,1),0 0 48px rgba(160,60,255,.8),0 0 80px rgba(160,60,255,.5),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }

  @keyframes evoRise{
    0%{transform:translateY(-14px) translateY(50px) scale(.9);opacity:0;filter:blur(2px)}
    100%{transform:translateY(-14px);opacity:1;filter:none}
  }
  @keyframes fall{
    0%{opacity:1;filter:none;transform:var(--fall-base,translateY(0))}
    40%{opacity:.5}
    100%{transform:var(--fall-base,translateY(0)) translateY(50px) scale(.82);opacity:0;filter:blur(3px)}
  }
  @keyframes fallNecro{
    0%{opacity:1;filter:none;transform:translateY(-14px)}
    40%{opacity:.5}
    100%{transform:translateY(36px) scale(.82);opacity:0;filter:blur(3px)}
  }
  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowPurple{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(160,60,255,.65),0 0 42px rgba(160,60,255,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(160,60,255,.9) ,0 0 58px rgba(160,60,255,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }

  .inline-log{
    margin-top:10px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">エグゼキュート</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア -->
    <div class="area-label">相手のバトルエリア</div>
    <div class="enemy-area">
      <div class="slot enemy">
        <div class="card" id="justiCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT19-064.png" alt="">
        </div>
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="slot">
        <!-- ファントモン（進化元・下） -->
        <div class="card" id="phantCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT20-072.png" alt="">
        </div>
        <!-- ネクロモン（進化先・上） -->
        <div class="card" id="necroCard" style="opacity:0">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT20-079.png" alt="">
        </div>
      </div>
    </div>

    <!-- 矢印SVG -->
    <svg class="arrow-layer" id="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="mhP" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(160,60,255,.96)"/>
        </marker>
      </defs>
      <line id="arrJusti"
        stroke="rgba(160,60,255,.9)" stroke-width="1.4"
        marker-end="url(#mhP)" opacity="0" style="transition:opacity .3s ease"/>
    </svg>

    <!-- エフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">エグゼキュート</div>
      <div class="fx-sub"  id="fxSub">EXECUTE</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        進化 → エグゼキュート発動 → バトル → ジャスティモン消滅 → ネクロモン消滅 → 消滅時効果
      </div>
    </div>
  </div>

</div></div>

<script>
const board     = document.getElementById("board");
const phantCard = document.getElementById("phantCard");
const necroCard = document.getElementById("necroCard");
const justiCard = document.getElementById("justiCard");
const arrJusti  = document.getElementById("arrJusti");
const fxOverlay = document.getElementById("fxOverlay");
const fxBg      = document.getElementById("fxBg");
const fxRing    = document.getElementById("fxRing");
const fxWord    = document.getElementById("fxWord");
const fxSub     = document.getElementById("fxSub");
const infoBox   = document.getElementById("infoBox");
const infoTitle = document.getElementById("infoTitle");
const infoText  = document.getElementById("infoText");
const nextBtn   = document.getElementById("nextBtn");
const prevBtn   = document.getElementById("prevBtn");
const playBtn   = document.getElementById("playBtn");
const resetBtn  = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 6;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const NECRO_STACK = "translateY(-14px)";
const NECRO_REST  = "translateY(-22px) rotate(90deg)";

const steps = [
  { title:"① 初期状態",
    text :"ファントモンがバトルエリアにいます。相手のバトルエリアにはジャスティモンが進化したターンです（アクティブ状態）。" },
  { title:"② 進化",
    text :"ファントモンがネクロモンに進化しました。ネクロモンはターン終了時にエグゼキュートを発動できます。" },
  { title:"③ エグゼキュート発動",
    text :"ターン終了時、エグゼキュートが発動します。攻撃対象は相手プレイヤー・レスト状態・アクティブ状態のデジモンまで選べます。今回はジャスティモンを対象にします。" },
  { title:"④ バトル",
    text :"アタック時効果・カウンター・ブロックのタイミングを経てバトルします。ネクロモンが勝利し、ジャスティモンが消滅します。" },
  { title:"⑤ ネクロモン消滅",
    text :"バトル終了後、勝敗に関わらずエグゼキュートを使用したデジモンは消滅します。ネクロモンとファントモンがトラッシュへ送られます。" },
  { title:"⑥ 消滅時効果",
    text :"消滅する際、消滅時・離れる時の効果は発揮されます。ネクロモンやファントモンが持つ効果はここで使用できます。" },
];

const GOLD   = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const RED    = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";
const PURPLE = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(160,60,255,.7),0 0 44px rgba(160,60,255,.35),0 10px 20px rgba(0,0,0,.42)";

// 矢印座標をDOMから動的計算
function updateArrows() {
  const br = board.getBoundingClientRect();
  const nr = necroCard.getBoundingClientRect();
  const jr = justiCard.getBoundingClientRect();
  const nx = ((nr.left + nr.width  / 2) - br.left) / br.width  * 100;
  const ny = ((nr.top  + nr.height / 2) - br.top)  / br.height * 100;
  const jx = ((jr.left + jr.width  / 2) - br.left) / br.width  * 100;
  const jy = ((jr.top  + jr.height / 2) - br.top)  / br.height * 100;
  arrJusti.setAttribute("x1", nx); arrJusti.setAttribute("y1", ny);
  arrJusti.setAttribute("x2", jx); arrJusti.setAttribute("y2", jy);
}

// 全カードを毎ステップ完全リセット
function applyState({ phantV, phantA, phantSh, necroV, necroT, necroA, necroSh, justiV, justiA, justiSh, aj } = {}) {
  phantCard.style.opacity   = phantV  === false ? "0" : "1";
  phantCard.style.animation = phantA  || "none";
  phantCard.style.boxShadow = phantSh || "";
  phantCard.style.filter    = "none";
  phantCard.style.transform = "";
  necroCard.style.opacity   = necroV  === false ? "0" : "1";
  necroCard.style.transform = necroT  || NECRO_STACK;
  necroCard.style.animation = necroA  || "none";
  necroCard.style.boxShadow = necroSh || "";
  necroCard.style.filter    = "none";
  justiCard.style.opacity   = justiV  === false ? "0" : "1";
  justiCard.style.animation = justiA  || "none";
  justiCard.style.boxShadow = justiSh || "";
  justiCard.style.filter    = "none";
  justiCard.style.transform = "";
  fxOverlay.style.opacity   = "0";
  if (aj) {
    requestAnimationFrame(() => { updateArrows(); arrJusti.style.opacity = "1"; });
  } else {
    arrJusti.style.opacity = "0";
  }
}

// 各ステップの確定状態
const S = [
  // 0: ファントモンのみ、ジャスティモンアクティブ
  () => applyState({ necroV:false }),
  // 1: ファントモン＋ネクロモンスタック、ジャスティモンアクティブ
  () => applyState({ necroV:true, necroA:"glowGold 1.4s ease infinite", necroSh:GOLD }),
  // 2: エグゼキュート発動・ネクロモンレスト・矢印→ジャスティモン
  () => applyState({ necroV:true, necroT:NECRO_REST, necroA:"glowPurple 1.4s ease infinite", necroSh:PURPLE, aj:true }),
  // 3: バトル・ジャスティモン消滅（非表示）
  () => applyState({ necroV:true, necroT:NECRO_REST, necroA:"glowGold 1.4s ease infinite", necroSh:GOLD, justiV:false }),
  // 4: ネクロモン＋ファントモンも消滅（全て非表示）
  () => applyState({ necroV:false, phantV:false, justiV:false }),
  // 5: 全消滅・消滅時効果（ファントモン・ネクロモンが薄く残って光る）
  () => {
    applyState({ necroV:false, phantV:false, justiV:false });
  },
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // ネクロモンがスタック位置へ滑り込む
    necroCard.style.opacity   = "1";
    necroCard.style.transform = "translateY(36px) scale(.9)";
    necroCard.style.filter    = "blur(2px)";
    necroCard.style.animation = "none";
    await sleep(30);
    necroCard.style.transition = "transform .45s cubic-bezier(.4,0,.2,1), filter .35s ease";
    necroCard.style.transform  = NECRO_STACK;
    necroCard.style.filter     = "none";
    await sleep(460);
    necroCard.style.transition = "";
    S[1]();
    return;
  }

  if (step === 2) {
    // エグゼキュートエフェクト→ネクロモンレスト→矢印→ジャスティモン
    await playFx();
    necroCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    necroCard.style.transform  = NECRO_REST;
    await sleep(520);
    necroCard.style.transition = "";
    S[2]();
    return;
  }

  if (step === 3) {
    // バトル：両方点滅→ジャスティモン消滅
    necroCard.style.animation = "blink .8s linear 1";
    necroCard.style.boxShadow = GOLD;
    justiCard.style.animation = "blink .8s linear 1";
    await sleep(820);
    // ジャスティモンがfallで消える
    justiCard.style.animation = "fall .5s ease forwards";
    await sleep(520);
    S[3]();
    return;
  }

  if (step === 4) {
    // ネクロモン＋ファントモンがfallで消える
    necroCard.style.transition = "transform .5s ease, opacity .5s ease, filter .5s ease";
    necroCard.style.transform  = `${NECRO_REST} translateY(50px) scale(.82)`;
    necroCard.style.opacity    = "0";
    necroCard.style.filter     = "blur(3px)";
    phantCard.style.animation  = "fall .5s ease forwards";
    await sleep(520);
    necroCard.style.transition = "";
    S[4]();
    return;
  }

  if (step === 5) {
    // 消滅時効果：ファントモン・ネクロモンが薄く再表示して点滅
    phantCard.style.opacity   = "0.7";
    phantCard.style.transform = "";
    phantCard.style.filter    = "none";
    necroCard.style.opacity   = "0.7";
    necroCard.style.transform = NECRO_REST;
    necroCard.style.filter    = "none";
    phantCard.style.animation = "blink .9s linear 1";
    phantCard.style.boxShadow = PURPLE;
    necroCard.style.animation = "blink .9s linear 1";
    necroCard.style.boxShadow = PURPLE;
    await sleep(920);
    phantCard.style.animation = "glowPurple 1.4s ease infinite";
    necroCard.style.animation = "glowPurple 1.4s ease infinite";
    phantCard.style.boxShadow = PURPLE;
    necroCard.style.boxShadow = PURPLE;
    return;
  }
}

async function goTo(step, instant = false) {
  cur = step;
  updateText();
  updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || cur >= TOTAL - 1) return;
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || playing || cur >= TOTAL - 1) return;
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800);
    if (!playing) break;
    locked = true;
    await goTo(cur + 1, false);
    locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

window.addEventListener("resize", () => { if (cur >= 2) updateArrows(); });
goTo(0, true);
</script>
</body>
</html>
