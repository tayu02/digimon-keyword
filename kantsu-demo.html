<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>貫通</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .enemy-area{
    display:flex;justify-content:center;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}
  .my-area{display:flex;justify-content:center;padding:10px 0 4px}

  .slot{
    width:108px;height:151px;
    position:relative;flex:0 0 auto;
  }
  .card{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease, opacity .3s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .enemy .card img{transform:rotate(180deg)}

  /* ダメージアイコン */
  .dmg-icon{
    position:absolute;
    width:52px;height:52px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff3a3a,#ff7a00);
    border:2px solid rgba(255,255,255,.3);
    box-shadow:0 0 20px rgba(255,60,0,.7),0 0 40px rgba(255,60,0,.4);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;color:#fff;letter-spacing:.04em;
    opacity:0;
    z-index:15;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .dmg-icon .dmg-num{font-size:20px;font-weight:900;line-height:1}

  /* 矢印SVG */
  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* 貫通エフェクト（オレンジ赤） */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(255,120,0,.22) 0%,rgba(255,120,0,.08) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(255,140,0,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(28px,8vw,46px);font-weight:900;
    letter-spacing:.12em;color:#fff;
    text-shadow:0 0 24px rgba(255,140,0,1),0 0 48px rgba(255,140,0,.8),0 0 80px rgba(255,140,0,.5),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }

  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowOrange{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,140,0,.65),0 0 42px rgba(255,140,0,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,140,0,.9) ,0 0 58px rgba(255,140,0,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }
  @keyframes fallRest{
    0%{opacity:1;filter:none;transform:rotate(-90deg)}
    40%{opacity:.5}
    100%{transform:rotate(-90deg) translateY(60px) scale(.82);opacity:0;filter:blur(3px)}
  }
  @keyframes dmgPop{
    0%{opacity:0;transform:scale(.5)}
    60%{opacity:1;transform:scale(1.15)}
    100%{opacity:1;transform:scale(1)}
  }

  .inline-log{
    margin-top:10px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">貫通</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア -->
    <div class="area-label">相手のバトルエリア</div>
    <div class="enemy-area">
      <div class="slot enemy">
        <div class="card" id="dolbCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT5-018.png" alt="">
        </div>
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="slot" id="mySlot">
        <div class="card" id="lastCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/P-173.png" alt="">
        </div>
      </div>
    </div>

    <!-- ダメージアイコン（相手プレイヤーへのダメージ表示） -->
    <div class="dmg-icon" id="dmgIcon" style="top:8%;left:50%;transform:translateX(-50%)">
      <div class="dmg-num">1</div>
      <div>ダメージ</div>
    </div>

    <!-- 矢印SVG -->
    <svg class="arrow-layer" id="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="mhG" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(255,214,106,.92)"/>
        </marker>
        <marker id="mhO" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(255,140,0,.96)"/>
        </marker>
        <marker id="mhR" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(255,91,91,.96)"/>
        </marker>
      </defs>
      <!-- ラストティラノモン→ドルビックモン -->
      <line id="arrDolb"
        stroke="rgba(255,214,106,.88)" stroke-width="1.4"
        marker-end="url(#mhG)" opacity="0" style="transition:opacity .3s ease"/>
      <!-- 貫通後→相手プレイヤー（上向き・オレンジ） -->
      <line id="arrPlayer"
        stroke="rgba(255,140,0,.9)" stroke-width="1.3" stroke-dasharray="3.5 2.5"
        marker-end="url(#mhO)" opacity="0" style="transition:opacity .3s ease"/>
    </svg>

    <!-- 貫通エフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">貫通</div>
      <div class="fx-sub"  id="fxSub">PIERCING</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        アタック → バトル勝利 → 貫通発動 → 相手プレイヤーに1点ダメージ
      </div>
    </div>
  </div>

</div></div>

<script>
const board    = document.getElementById("board");
const lastCard = document.getElementById("lastCard");
const dolbCard = document.getElementById("dolbCard");
const dmgIcon  = document.getElementById("dmgIcon");
const arrDolb  = document.getElementById("arrDolb");
const arrPlayer= document.getElementById("arrPlayer");
const fxOverlay= document.getElementById("fxOverlay");
const fxBg     = document.getElementById("fxBg");
const fxRing   = document.getElementById("fxRing");
const fxWord   = document.getElementById("fxWord");
const fxSub    = document.getElementById("fxSub");
const infoBox  = document.getElementById("infoBox");
const infoTitle= document.getElementById("infoTitle");
const infoText = document.getElementById("infoText");
const nextBtn  = document.getElementById("nextBtn");
const prevBtn  = document.getElementById("prevBtn");
const playBtn  = document.getElementById("playBtn");
const resetBtn = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 5;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const LAST_REST = "translateY(-22px) rotate(90deg)";
const GOLD   = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const RED    = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";
const ORANGE = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,140,0,.7),0 0 44px rgba(255,140,0,.35),0 10px 20px rgba(0,0,0,.42)";

const steps = [
  { title:"① 初期状態",
    text :"ラストティラノモンがバトルエリアにいます。相手のバトルエリアにはドルビックモンがレスト状態です。" },
  { title:"② アタック宣言",
    text :"ラストティラノモンがドルビックモンにアタックを宣言し、レスト状態になりました。" },
  { title:"③ バトル勝利",
    text :"アタック時効果・カウンター・ブロックのタイミングを経てバトルになります。DPでラストティラノモンが勝利し、ドルビックモンが消滅します。" },
  { title:"④ 貫通発動",
    text :"貫通が発動します。貫通を持つデジモンがアタックしてバトルに勝利した時、相手プレイヤーに1点のダメージを与えます。" },
  { title:"⑤ Sアタック+1について",
    text :"Sアタック+1を持っている場合、貫通のダメージがその分増加します。例えばSアタック+1を持っていれば貫通と合わせて合計2点のダメージになります。" },
];

// 矢印座標をDOMから動的計算
function updateArrows() {
  const br = board.getBoundingClientRect();
  const lr = lastCard.getBoundingClientRect();
  const dr = dolbCard.getBoundingClientRect();

  const lx = ((lr.left + lr.width  / 2) - br.left) / br.width  * 100;
  const ly = ((lr.top  + lr.height / 2) - br.top)  / br.height * 100;
  const dx = ((dr.left + dr.width  / 2) - br.left) / br.width  * 100;
  const dy = ((dr.top  + dr.height / 2) - br.top)  / br.height * 100;

  // ラストティラノモン→ドルビックモン
  arrDolb.setAttribute("x1", lx); arrDolb.setAttribute("y1", ly);
  arrDolb.setAttribute("x2", dx); arrDolb.setAttribute("y2", dy);

  // ラストティラノモン→相手プレイヤー（上端）
  arrPlayer.setAttribute("x1", lx); arrPlayer.setAttribute("y1", ly);
  arrPlayer.setAttribute("x2", lx); arrPlayer.setAttribute("y2", 3);
}

// 全状態リセット
function applyState({ lastT, lastA, lastSh, dolbV, dolbA, dolbSh, showArrD, showArrP, showDmg } = {}) {
  lastCard.style.transform = lastT   || "";
  lastCard.style.animation = lastA   || "none";
  lastCard.style.boxShadow = lastSh  || "";
  lastCard.style.filter    = "none";
  lastCard.style.opacity   = "1";
  dolbCard.style.opacity   = dolbV   === false ? "0" : "1";
  dolbCard.style.animation = dolbA   || "none";
  dolbCard.style.boxShadow = dolbSh  || "";
  dolbCard.style.filter    = "none";
  dolbCard.style.transform = "rotate(-90deg)";
  dmgIcon.style.opacity    = showDmg ? "1" : "0";
  fxOverlay.style.opacity  = "0";

  if (showArrD || showArrP) {
    requestAnimationFrame(() => {
      updateArrows();
      arrDolb.style.opacity   = showArrD ? "1" : "0";
      arrPlayer.style.opacity = showArrP ? "1" : "0";
    });
  } else {
    arrDolb.style.opacity   = "0";
    arrPlayer.style.opacity = "0";
  }
}

const S = [
  // 0: 初期状態
  () => applyState({ lastA:"glowGold 1.4s ease infinite", lastSh:GOLD }),
  // 1: ラストティラノモンレスト・矢印→ドルビックモン
  () => applyState({ lastT:LAST_REST, lastA:"glowGold 1.4s ease infinite", lastSh:GOLD, showArrD:true }),
  // 2: バトル勝利・ドルビックモン消滅
  () => applyState({ lastT:LAST_REST, lastA:"glowGold 1.4s ease infinite", lastSh:GOLD, dolbV:false }),
  // 3: 貫通発動・矢印→プレイヤー・ダメージアイコン
  () => applyState({ lastT:LAST_REST, lastA:"glowOrange 1.4s ease infinite", lastSh:ORANGE, dolbV:false, showArrP:true, showDmg:true }),
  // 4: Sアタック+1説明（状態維持）
  () => applyState({ lastT:LAST_REST, lastA:"glowOrange 1.4s ease infinite", lastSh:ORANGE, dolbV:false, showArrP:true, showDmg:true }),
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // レスト回転→矢印
    lastCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    lastCard.style.transform  = LAST_REST;
    await sleep(520);
    lastCard.style.transition = "";
    S[1]();
    return;
  }

  if (step === 2) {
    // 両方点滅→ドルビックモン消滅
    lastCard.style.animation = "blink .8s linear 1";
    lastCard.style.boxShadow = GOLD;
    dolbCard.style.animation = "blink .8s linear 1";
    await sleep(820);
    dolbCard.style.animation = "fallRest .5s ease forwards";
    await sleep(520);
    S[2]();
    return;
  }

  if (step === 3) {
    // 貫通エフェクト→オレンジに光る→矢印→ダメージアイコン
    await playFx();
    S[3]();
    await sleep(200);
    dmgIcon.style.animation = "dmgPop .4s cubic-bezier(.4,0,.2,1) forwards";
    return;
  }

  if (step === 4) { S[4](); return; }
}

async function goTo(step, instant = false) {
  cur = step;
  updateText();
  updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || cur >= TOTAL - 1) return;
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || playing || cur >= TOTAL - 1) return;
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800);
    if (!playing) break;
    locked = true;
    await goTo(cur + 1, false);
    locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

window.addEventListener("resize", () => { if (cur >= 1) updateArrows(); });
goTo(0, true);
</script>
</body>
</html>
