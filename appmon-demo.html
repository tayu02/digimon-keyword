<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>アプ合体</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .my-area{
    display:flex;justify-content:center;align-items:flex-start;
    padding:10px 0 4px;
    min-height:220px;
  }

  /*
    アプリンク表現：
    リバイブモン（縦）の右にバイオモンが横向き（rotate(90deg)）で
    カードの左端がリバイブモンの右端に半分重なるイメージ。
    スロット全体で表現。
  */
  .applink-slot{
    position:relative;
    width:240px;
    height:160px;
  }

  /* リバイブモン */
  #reviveCard{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease, opacity .4s ease;
    z-index:2;
  }
  #reviveCard img{width:100%;height:100%;object-fit:cover;display:block}

  /*
    バイオモン（アプリンク）
    反時計回り90度回転・リバイブモン右側に差し込み
    rotate(-90deg)すると元108×151が幅151×高さ108になる
    left: リバイブモン右端(108) - 少し重なり(30) = 78
    top:  中心を合わせる = (151-108)/2 = 21.5 → 約20px
  */
  #bioCard{
    position:absolute;
    width:108px;height:151px;
    left:78px;top:20px;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,180,255,.3);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transform:rotate(-90deg);
    opacity:0;
    transition:opacity .4s ease, box-shadow .3s ease;
    z-index:3;
  }
  #bioCard img{width:100%;height:100%;object-fit:cover;display:block}

  /* ハデスモン（アプ合体後） */
  #hadesCard{
    position:absolute;
    width:108px;height:151px;
    left:0;top:-14px;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    opacity:0;
    transition:box-shadow .3s ease, filter .25s ease, opacity .4s ease;
    z-index:4;
  }
  #hadesCard img{width:100%;height:100%;object-fit:cover;display:block}

  /* バイオモン（アプ合体後：ズレて重なる進化元） */
  #bioEvo{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0px;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 8px 16px rgba(0,0,0,.42);
    background:#09111f;
    opacity:0;
    z-index:1;
    filter:brightness(.8);
    transition:opacity .4s ease;
  }
  #bioEvo img{width:100%;height:100%;object-fit:cover;display:block}

  /* エフェクト */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,rgba(200,100,255,.22) 0%,rgba(200,100,255,.08) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid rgba(200,100,255,.95);opacity:0;}
  .fx-word{
    position:relative;font-size:clamp(22px,6vw,38px);font-weight:900;
    letter-spacing:.1em;color:#fff;
    text-shadow:0 0 24px rgba(200,100,255,1),0 0 48px rgba(200,100,255,.8),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }
  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowPurple{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(200,100,255,.65),0 0 42px rgba(200,100,255,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(200,100,255,.9) ,0 0 58px rgba(200,100,255,.48),0 10px 20px rgba(0,0,0,.42)}
  }

  .inline-log{
    margin-top:10px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{font-size:11px;color:rgba(158,178,208,.45);text-align:center;padding:2px 0;}
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">
  <div class="top">
    <div class="title">アプ合体</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="applink-slot" id="applinkSlot">

        <!-- バイオモン（アプ合体後の進化元） -->
        <div id="bioEvo">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT24-038.png" alt="">
        </div>

        <!-- リバイブモン -->
        <div id="reviveCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT24-077.png" alt="">
        </div>

        <!-- バイオモン（アプリンク：横向き差し込み） -->
        <div id="bioCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT24-038.png" alt="">
        </div>

        <!-- ハデスモン（アプ合体後） -->
        <div id="hadesCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT24-079.png" alt="">
        </div>

      </div>
    </div>

    <!-- アプ合体エフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">アプ合体</div>
      <div class="fx-sub"  id="fxSub">APP COMBINE</div>
    </div>

    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">リバイブモン登場 → アプリンク（バイオモン横刺し）→ アプ合体 → ハデスモン進化</div>
    </div>
  </div>
</div></div>

<script>
const board      = document.getElementById("board");
const reviveCard = document.getElementById("reviveCard");
const bioCard    = document.getElementById("bioCard");
const hadesCard  = document.getElementById("hadesCard");
const bioEvo     = document.getElementById("bioEvo");
const fxOverlay  = document.getElementById("fxOverlay");
const fxBg       = document.getElementById("fxBg");
const fxRing     = document.getElementById("fxRing");
const fxWord     = document.getElementById("fxWord");
const fxSub      = document.getElementById("fxSub");
const infoBox    = document.getElementById("infoBox");
const infoTitle  = document.getElementById("infoTitle");
const infoText   = document.getElementById("infoText");
const nextBtn    = document.getElementById("nextBtn");
const prevBtn    = document.getElementById("prevBtn");
const playBtn    = document.getElementById("playBtn");
const resetBtn   = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 3;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const GOLD   = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const PURPLE = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(200,100,255,.7),0 0 44px rgba(200,100,255,.35),0 10px 20px rgba(0,0,0,.42)";

const steps = [
  { title:"① リバイブモン登場",
    text :"リバイブモンがバトルエリアにいます。" },
  { title:"② アプリンク",
    text :"バイオモンをリバイブモンに横向きで差し込み、アプリンクさせます。アプリンクしている間、効果やDPが上昇します。" },
  { title:"③ アプ合体発動",
    text :"指定のデジモンがアプリンクしている時、アプ合体が発動します。横向きに刺していたバイオモンがリバイブモンの上にズレて重なり、その上にハデスモンに進化します。" },
];

function resetAll() {
  reviveCard.style.animation = "none";
  reviveCard.style.boxShadow = "";
  reviveCard.style.opacity   = "1";
  bioCard.style.opacity      = "0";
  bioCard.style.transform    = "rotate(-90deg)";
  bioCard.style.left         = "78px";
  bioCard.style.boxShadow    = "";
  hadesCard.style.opacity    = "0";
  hadesCard.style.animation  = "none";
  hadesCard.style.boxShadow  = "";
  bioEvo.style.opacity       = "0";
  fxOverlay.style.opacity    = "0";
}

const S = [
  // 0: リバイブモンのみ
  () => {
    resetAll();
    reviveCard.style.animation = "glowGold 1.4s ease infinite";
    reviveCard.style.boxShadow = GOLD;
  },
  // 1: バイオモン右側差し込み
  () => {
    resetAll();
    reviveCard.style.animation = "glowGold 1.4s ease infinite";
    reviveCard.style.boxShadow = GOLD;
    bioCard.style.opacity      = "1";
    bioCard.style.transform    = "rotate(-90deg)";
    bioCard.style.boxShadow    = "0 0 0 2px rgba(255,180,255,.3),0 0 16px rgba(200,100,255,.5),0 10px 20px rgba(0,0,0,.42)";
  },
  // 2: アプ合体後・バイオモンが進化元・ハデスモン登場
  () => {
    resetAll();
    bioEvo.style.opacity       = "1";
    hadesCard.style.opacity    = "1";
    hadesCard.style.animation  = "glowPurple 1.4s ease infinite";
    hadesCard.style.boxShadow  = PURPLE;
  },
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFxAnim() {
  fxOverlay.style.opacity = "1";
  [fxBg,fxRing,fxWord,fxSub].forEach(el=>{el.style.animation="none";void el.offsetWidth;});
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // バイオモンが右からフェードインして差し込まれる
    bioCard.style.opacity    = "1";
    bioCard.style.transition = "opacity .4s ease";
    await sleep(420);
    bioCard.style.transition = "";
    bioCard.style.boxShadow  = "0 0 0 2px rgba(255,180,255,.3),0 0 16px rgba(200,100,255,.5),0 10px 20px rgba(0,0,0,.42)";
    S[1](); return;
  }

  if (step === 2) {
    await playFxAnim();
    bioCard.style.transition = "opacity .4s ease";
    bioCard.style.opacity    = "0";
    bioEvo.style.opacity     = "1";
    await sleep(420);
    bioCard.style.transition = "";
    hadesCard.style.opacity   = "1";
    hadesCard.style.animation = "glowPurple 1.4s ease infinite";
    hadesCard.style.boxShadow = PURPLE;
    S[2](); return;
  }
}

async function goTo(step, instant = false) {
  cur = step; updateText(); updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  if (locked || cur >= TOTAL - 1) return;
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  if (locked || playing || cur >= TOTAL - 1) return;
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800); if (!playing) break;
    locked = true; await goTo(cur + 1, false); locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

goTo(0, true);
</script>
</body>
</html>
