<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ブロッカー</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .enemy-area{
    display:flex;justify-content:center;gap:20px;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}
  .my-area{display:flex;justify-content:center;padding:10px 0 4px}

  .slot{
    width:108px;height:151px;
    position:relative;flex:0 0 auto;
  }
  .card{
    position:absolute;inset:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .enemy .card img{transform:rotate(180deg)}

  /* 矢印SVG */
  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* ブロッカーエフェクト */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(74,215,255,.18) 0%,rgba(74,215,255,.07) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(74,215,255,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(24px,7vw,42px);font-weight:900;
    letter-spacing:.14em;color:#fff;
    text-shadow:0 0 20px rgba(74,215,255,.95),0 0 40px rgba(74,215,255,.6),0 2px 6px rgba(0,0,0,.9);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }

  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowCyan{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(74,215,255,.65),0 0 42px rgba(74,215,255,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(74,215,255,.9) ,0 0 58px rgba(74,215,255,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }
  @keyframes shakeX{
    0%,100%{transform:translateX(0)}
    25%    {transform:translateX(-5px)}
    75%    {transform:translateX(5px)}
  }

  .inline-log{
    margin-top:10px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">ブロッカー</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア -->
    <div class="area-label">相手のバトルエリア</div>
    <div class="enemy-area">
      <div class="slot enemy">
        <div class="card" id="piemonCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX1-064.png" alt="">
        </div>
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="slot">
        <div class="card" id="craniumCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT3-075.png" alt="">
        </div>
      </div>
    </div>

    <!-- 矢印SVG -->
    <svg class="arrow-layer" id="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="mhR" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(255,91,91,.96)"/>
        </marker>
        <marker id="mhC" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(74,215,255,.96)"/>
        </marker>
      </defs>
      <!-- ピエモン→自分プレイヤー（下向き・点線・赤） -->
      <line id="arrPlayer"
        stroke="rgba(255,91,91,.88)" stroke-width="1.1" stroke-dasharray="3.5 2.5"
        marker-end="url(#mhR)" opacity="0" style="transition:opacity .3s ease"/>
      <!-- ピエモン→クレニアムモン（ブロック後・シアン） -->
      <line id="arrCranium"
        stroke="rgba(74,215,255,.94)" stroke-width="1.4"
        marker-end="url(#mhC)" opacity="0" style="transition:opacity .3s ease"/>
    </svg>

    <!-- ブロッカーエフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">ブロッカー</div>
      <div class="fx-sub"  id="fxSub">BLOCKER</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        アタック宣言 → アタック時効果 → ブロッカー発動 → 対象変更効果 → バトル
      </div>
    </div>
  </div>

</div></div>

<script>
const board        = document.getElementById("board");
const piemonCard   = document.getElementById("piemonCard");
const craniumCard  = document.getElementById("craniumCard");
const arrowSvg     = document.getElementById("arrowSvg");
const arrPlayer    = document.getElementById("arrPlayer");
const arrCranium   = document.getElementById("arrCranium");
const fxOverlay    = document.getElementById("fxOverlay");
const fxBg         = document.getElementById("fxBg");
const fxRing       = document.getElementById("fxRing");
const fxWord       = document.getElementById("fxWord");
const fxSub        = document.getElementById("fxSub");
const infoBox      = document.getElementById("infoBox");
const infoTitle    = document.getElementById("infoTitle");
const infoText     = document.getElementById("infoText");
const nextBtn      = document.getElementById("nextBtn");
const prevBtn      = document.getElementById("prevBtn");
const playBtn      = document.getElementById("playBtn");
const resetBtn     = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 7;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const steps = [
  { title:"① 初期状態",               text:"クレニアムモンがアクティブでバトルエリアに立っています。相手のバトルエリアにピエモンがいます。" },
  { title:"② アタック宣言",           text:"ピエモンがアタックを宣言し、レスト状態になりました。攻撃対象は自分プレイヤーです。" },
  { title:"③ アタック時効果",         text:"アタックを宣言したデジモンのアタック時効果が発動します。" },
  { title:"④ ブロッカー発動",         text:"クレニアムモンのブロッカーが発動します。クレニアムモンがレストして、攻撃対象をクレニアムモンに変更します。" },
  { title:"⑤ 対象変更時の効果",       text:"攻撃対象が変更されたことによる効果が発動します。" },
  { title:"⑥ バトル",                 text:"クレニアムモンとピエモンがバトルします。" },
  { title:"⑦ ブロッカーの注意点",     text:"①相手に攻撃対象を変更されない効果を持つデジモンに対しては、ブロックの宣言自体ができません。ブロックは攻撃対象を変更する効果のためです。②ブロックはカードの効果ではないため、「効果でレストした時に発動する効果」はブロックでレストしても発動しません。" },
];

const GOLD = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const RED  = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";
const CYAN = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(74,215,255,.7),0 0 44px rgba(74,215,255,.35),0 10px 20px rgba(0,0,0,.42)";

const CRANIUM_REST = "translateY(-22px) rotate(90deg)";

// 矢印座標をDOMから動的計算
function updateArrows() {
  const br = board.getBoundingClientRect();
  const pr = piemonCard.getBoundingClientRect();
  const cr = craniumCard.getBoundingClientRect();

  // ピエモン中心
  const px = ((pr.left + pr.width  / 2) - br.left) / br.width  * 100;
  const py = ((pr.top  + pr.height / 2) - br.top)  / br.height * 100;

  // クレニアムモン中心
  const cx = ((cr.left + cr.width  / 2) - br.left) / br.width  * 100;
  const cy = ((cr.top  + cr.height / 2) - br.top)  / br.height * 100;

  // プレイヤー方向（ピエモンから下、ボード下端付近）
  arrPlayer.setAttribute("x1", px);  arrPlayer.setAttribute("y1", py);
  arrPlayer.setAttribute("x2", px);  arrPlayer.setAttribute("y2", 97);

  // クレニアムモン中心へ
  arrCranium.setAttribute("x1", px); arrCranium.setAttribute("y1", py);
  arrCranium.setAttribute("x2", cx); arrCranium.setAttribute("y2", cy);
}

// 全カードを毎ステップ完全リセットしてから必要なものだけ光らせる
function applyState({ piemonT, piemonA, piemonSh, craniumT, craniumA, craniumSh, ap, ac } = {}) {
  piemonCard.style.transform  = piemonT   || "";
  piemonCard.style.animation  = piemonA   || "none";
  piemonCard.style.boxShadow  = piemonSh  || "";
  piemonCard.style.filter     = "none";
  craniumCard.style.transform = craniumT  || "";
  craniumCard.style.animation = craniumA  || "none";
  craniumCard.style.boxShadow = craniumSh || "";
  craniumCard.style.filter    = "none";
  fxOverlay.style.opacity     = "0";

  if (ap || ac) {
    requestAnimationFrame(() => {
      updateArrows();
      arrPlayer.style.opacity  = ap ? "1" : "0";
      arrCranium.style.opacity = ac ? "1" : "0";
    });
  } else {
    arrPlayer.style.opacity  = "0";
    arrCranium.style.opacity = "0";
  }
}

// 各ステップの確定状態
const S = [
  // 0: 初期状態（誰も光らない）
  () => applyState({}),
  // 1: ピエモンレスト・赤く光る、矢印→プレイヤー
  () => applyState({ piemonT:"rotate(90deg)", piemonA:"glowRed 1.4s ease infinite", piemonSh:RED, ap:true }),
  // 2: アタック時効果（ピエモンだけ光る）
  () => applyState({ piemonT:"rotate(90deg)", piemonA:"glowRed 1.4s ease infinite", piemonSh:RED, ap:true }),
  // 3: ブロッカー発動・クレニアムモンレスト、矢印→クレニアムモン
  () => applyState({ piemonT:"rotate(90deg)", craniumT:CRANIUM_REST, craniumA:"glowCyan 1.4s ease infinite", craniumSh:CYAN, ac:true }),
  // 4: 対象変更時の効果（クレニアムモンだけ光る）
  () => applyState({ piemonT:"rotate(90deg)", craniumT:CRANIUM_REST, craniumA:"glowCyan 1.4s ease infinite", craniumSh:CYAN, ac:true }),
  // 5: バトル（ピエモン赤・クレニアムモンシアン）
  () => applyState({ piemonT:"rotate(90deg)", piemonA:"glowRed 1.4s ease infinite", piemonSh:RED, craniumT:CRANIUM_REST, craniumA:"glowCyan 1.4s ease infinite", craniumSh:CYAN, ac:true }),
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // ピエモンがshake→レスト→赤く光る→矢印プレイヤー
    piemonCard.style.animation = "shakeX .25s linear";
    await sleep(260);
    piemonCard.style.animation  = "none";
    piemonCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    piemonCard.style.transform  = "rotate(90deg)";
    await sleep(520);
    piemonCard.style.transition = "";
    S[1]();
    return;
  }

  if (step === 2) {
    // アタック時効果：ピエモン点滅
    piemonCard.style.animation = "blink .8s linear 1";
    piemonCard.style.boxShadow = RED;
    await sleep(820);
    S[2]();
    return;
  }

  if (step === 3) {
    // ブロッカーエフェクト→クレニアムモンレスト→シアンに光る
    await playFx();
    craniumCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    craniumCard.style.transform  = CRANIUM_REST;
    await sleep(520);
    craniumCard.style.transition = "";
    S[3]();
    return;
  }

  if (step === 4) {
    // 対象変更時効果：クレニアムモン点滅
    craniumCard.style.animation = "blink .8s linear 1";
    craniumCard.style.boxShadow = CYAN;
    await sleep(820);
    S[4]();
    return;
  }

  if (step === 5) {
    // バトル：両方点滅
    piemonCard.style.animation  = "blink .8s linear 1";
    piemonCard.style.boxShadow  = RED;
    craniumCard.style.animation = "blink .8s linear 1";
    craniumCard.style.boxShadow = CYAN;
    await sleep(820);
    S[5]();
    return;
  }
}

async function goTo(step, instant = false) {
  cur = step;
  updateText();
  updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || cur >= TOTAL - 1) return;
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || playing || cur >= TOTAL - 1) return;
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800);
    if (!playing) break;
    locked = true;
    await goTo(cur + 1, false);
    locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

window.addEventListener("resize", () => { if (cur >= 1) updateArrows(); });
goTo(0, true);
</script>
</body>
</html>
