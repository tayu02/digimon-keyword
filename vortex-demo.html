<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ヴォルテクス</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .enemy-area{
    display:flex;justify-content:center;gap:20px;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}
  .my-area{display:flex;justify-content:center;padding:10px 0 4px}

  .slot{
    width:108px;height:151px;
    position:relative;flex:0 0 auto;
  }
  .card{
    position:absolute;inset:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .enemy .card img{transform:rotate(180deg)}

  /* 矢印SVG */
  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* エフェクトオーバーレイ */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(160,80,255,.2) 0%,rgba(160,80,255,.08) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(180,100,255,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(20px,6vw,38px);font-weight:900;
    letter-spacing:.1em;color:#fff;
    text-shadow:0 0 20px rgba(180,100,255,.95),0 0 40px rgba(180,100,255,.6),0 2px 6px rgba(0,0,0,.9);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }

  /* rise */
  @keyframes rise{
    0%{transform:translateY(80px) scale(.88);opacity:0;filter:blur(2px)}
    100%{transform:translateY(0) scale(1);opacity:1;filter:none}
  }

  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowPurple{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(180,100,255,.65),0 0 42px rgba(180,100,255,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(180,100,255,.9) ,0 0 58px rgba(180,100,255,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }

  .inline-log{
    margin-top:10px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">ヴォルテクス</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア -->
    <div class="area-label">相手のバトルエリア</div>
    <div class="enemy-area">
      <div class="slot enemy">
        <div class="card" id="enemyCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT5-016.png" alt="">
        </div>
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="slot">
        <div class="card" id="zephyrCard" style="opacity:0">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/ST18-12.png" alt="">
        </div>
      </div>
    </div>

    <!-- 矢印SVG -->
    <svg class="arrow-layer" id="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="mhP" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(180,100,255,.96)"/>
        </marker>
      </defs>
      <!-- ゼファーガモン→相手デジモン -->
      <line id="arrEnemy"
        stroke="rgba(180,100,255,.9)" stroke-width="1.4"
        marker-end="url(#mhP)" opacity="0" style="transition:opacity .3s ease"/>
    </svg>

    <!-- エフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">ヴォルテクス</div>
      <div class="fx-sub"  id="fxSub">VORTEX</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        登場 → ヴォルテクス発動 → アタック宣言 → アタック時効果 → カウンター・ブロック → バトル
      </div>
    </div>
  </div>

</div></div>

<script>
const board      = document.getElementById("board");
const zephyrCard = document.getElementById("zephyrCard");
const enemyCard  = document.getElementById("enemyCard");
const arrowSvg   = document.getElementById("arrowSvg");
const arrEnemy   = document.getElementById("arrEnemy");
const fxOverlay  = document.getElementById("fxOverlay");
const fxBg       = document.getElementById("fxBg");
const fxRing     = document.getElementById("fxRing");
const fxWord     = document.getElementById("fxWord");
const fxSub      = document.getElementById("fxSub");
const infoBox    = document.getElementById("infoBox");
const infoTitle  = document.getElementById("infoTitle");
const infoText   = document.getElementById("infoText");
const nextBtn    = document.getElementById("nextBtn");
const prevBtn    = document.getElementById("prevBtn");
const playBtn    = document.getElementById("playBtn");
const resetBtn   = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 6;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 相手カードのレスト位置（最初からレスト状態）
// 相手カードはimg rotate(180deg)なので、カード自体のrotateは-90deg
const ENEMY_REST = "rotate(-90deg)";

const steps = [
  { title:"① 登場",
    text :"ゼファーガモンがバトルエリアに登場しました。相手のバトルエリアにはすでにレスト状態のデジモンがいます。" },
  { title:"② ヴォルテクス発動",
    text :"ヴォルテクスが発動します。ヴォルテクスは登場したターンでもアタックが可能で、対象は相手のレスト状態のデジモンのみです。レスト状態のデジモンがいない場合は攻撃できません。" },
  { title:"③ アタック宣言",
    text :"ゼファーガモンがアタックを宣言し、レスト状態の相手デジモンを対象に攻撃します。" },
  { title:"④ アタック時効果",
    text :"アタックを宣言したデジモンのアタック時効果が発動します。" },
  { title:"⑤ カウンター・ブロック",
    text :"相手のカウンターやブロックのタイミングです。" },
  { title:"⑥ バトル",
    text :"ゼファーガモンと相手デジモンがバトルします。" },
];

const GOLD   = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const RED    = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";
const PURPLE = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(180,100,255,.7),0 0 44px rgba(180,100,255,.35),0 10px 20px rgba(0,0,0,.42)";

// 矢印座標をDOMから動的計算
function updateArrows() {
  const br = board.getBoundingClientRect();
  const zr = zephyrCard.getBoundingClientRect();
  const er = enemyCard.getBoundingClientRect();

  const zx = ((zr.left + zr.width  / 2) - br.left) / br.width  * 100;
  const zy = ((zr.top  + zr.height / 2) - br.top)  / br.height * 100;
  const ex = ((er.left + er.width  / 2) - br.left) / br.width  * 100;
  const ey = ((er.top  + er.height / 2) - br.top)  / br.height * 100;

  arrEnemy.setAttribute("x1", zx); arrEnemy.setAttribute("y1", zy);
  arrEnemy.setAttribute("x2", ex); arrEnemy.setAttribute("y2", ey);
}

// 全カードを毎ステップ完全リセット
function applyState({ zephyrVisible, zephyrT, zephyrA, zephyrSh, enemyT, enemyA, enemySh, ae } = {}) {
  // ゼファーガモン
  zephyrCard.style.opacity   = zephyrVisible === false ? "0" : "1";
  zephyrCard.style.transform = zephyrT  || "";
  zephyrCard.style.animation = zephyrA  || "none";
  zephyrCard.style.boxShadow = zephyrSh || "";
  zephyrCard.style.filter    = "none";
  // 相手デジモン
  enemyCard.style.transform  = enemyT   || ENEMY_REST;
  enemyCard.style.animation  = enemyA   || "none";
  enemyCard.style.boxShadow  = enemySh  || "";
  enemyCard.style.filter     = "none";
  fxOverlay.style.opacity    = "0";

  if (ae) {
    requestAnimationFrame(() => {
      updateArrows();
      arrEnemy.style.opacity = "1";
    });
  } else {
    arrEnemy.style.opacity = "0";
  }
}

const ZEPHYR_REST = "translateY(-22px) rotate(90deg)";

// 各ステップの確定状態
const S = [
  // 0: 登場直後（ゼファーガモン表示・金色、相手レスト）
  () => applyState({ zephyrA:"glowGold 1.4s ease infinite", zephyrSh:GOLD }),
  // 1: ヴォルテクス発動（ゼファーガモン紫に光る、矢印→相手）
  () => applyState({ zephyrA:"glowPurple 1.4s ease infinite", zephyrSh:PURPLE, ae:true }),
  // 2: アタック宣言（ゼファーガモンレスト・紫、矢印→相手）
  () => applyState({ zephyrT:ZEPHYR_REST, zephyrA:"glowPurple 1.4s ease infinite", zephyrSh:PURPLE, ae:true }),
  // 3: アタック時効果（ゼファーガモンレスト・金色点滅）
  () => applyState({ zephyrT:ZEPHYR_REST, zephyrA:"glowGold 1.4s ease infinite", zephyrSh:GOLD, ae:true }),
  // 4: カウンター・ブロック（誰も光らない）
  () => applyState({ zephyrT:ZEPHYR_REST, ae:true }),
  // 5: バトル（両方光る）
  () => applyState({ zephyrT:ZEPHYR_REST, zephyrA:"glowGold 1.4s ease infinite", zephyrSh:GOLD, enemyA:"glowRed 1.4s ease infinite", enemySh:RED, ae:true }),
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) {
    // ゼファーガモンがriseで登場
    zephyrCard.style.opacity   = "1";
    zephyrCard.style.transform = "translateY(80px) scale(.88)";
    zephyrCard.style.filter    = "blur(2px)";
    zephyrCard.style.animation = "none";
    await sleep(30);
    zephyrCard.style.animation = "rise .5s ease forwards";
    await sleep(520);
    zephyrCard.style.filter    = "none";
    zephyrCard.style.transform = "";
    S[0]();
    return;
  }

  if (step === 1) {
    // ヴォルテクスエフェクト→矢印→紫に光る
    await playFx();
    await sleep(100);
    S[1]();
    return;
  }

  if (step === 2) {
    // アタック宣言：ゼファーガモンがレスト回転
    zephyrCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    zephyrCard.style.transform  = ZEPHYR_REST;
    await sleep(520);
    zephyrCard.style.transition = "";
    S[2]();
    return;
  }

  if (step === 3) {
    // アタック時効果：ゼファーガモン点滅
    zephyrCard.style.animation = "blink .8s linear 1";
    zephyrCard.style.boxShadow = GOLD;
    await sleep(820);
    S[3]();
    return;
  }

  if (step === 4) {
    // カウンター・ブロック
    S[4]();
    return;
  }

  if (step === 5) {
    // バトル：両方点滅
    zephyrCard.style.animation = "blink .8s linear 1";
    zephyrCard.style.boxShadow = GOLD;
    enemyCard.style.animation  = "blink .8s linear 1";
    enemyCard.style.boxShadow  = RED;
    await sleep(820);
    S[5]();
    return;
  }
}

async function goTo(step, instant = false) {
  cur = step;
  updateText();
  updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || cur >= TOTAL - 1) return;
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || playing || cur >= TOTAL - 1) return;
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800);
    if (!playing) break;
    locked = true;
    await goTo(cur + 1, false);
    locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

window.addEventListener("resize", () => { if (cur >= 1) updateArrows(); });
goTo(0, true);
</script>
</body>
</html>
