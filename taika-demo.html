<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>退化</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}

  .battle-row{
    display:flex;justify-content:center;gap:24px;
    padding:8px 0;
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:4px 0;
    border-top:1px dashed rgba(255,255,255,.1);border-bottom:1px dashed rgba(255,255,255,.1);
    margin:4px 0;
  }

  /* スタックスロット */
  .stack-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;}
  .stack-label{font-size:10px;color:var(--muted);letter-spacing:.06em;}
  .stack-slot{width:108px;height:240px;position:relative;}

  .scard{
    position:absolute;
    width:108px;height:151px;
    left:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 8px 16px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:opacity .4s ease, box-shadow .3s ease, top .4s ease;
  }
  .scard img{width:100%;height:100%;object-fit:cover;display:block}

  /* 相手スタック初期位置 */
  #eHiya { top:72px; z-index:1; filter:brightness(.55); }
  #eBuru { top:54px; z-index:2; filter:brightness(.68); }
  #ePale { top:36px; z-index:3; filter:brightness(.80); }
  #eCris { top:18px; z-index:4; filter:brightness(.90); }
  #eHexe { top:0px;  z-index:5; }

  /* 自分カード */
  .my-slot{width:108px;height:151px;position:relative;flex:0 0 auto;}
  .digi-card{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, opacity .4s ease;
  }
  .digi-card img{width:100%;height:100%;object-fit:cover;display:block}

  /* エフェクト */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(100,180,255,.22) 0%,rgba(100,180,255,.08) 45%,transparent 72%);}
  .fx-ring{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid rgba(100,180,255,.95);opacity:0;}
  .fx-word{
    position:relative;font-size:clamp(24px,7vw,42px);font-weight:900;
    letter-spacing:.1em;color:#fff;
    text-shadow:0 0 24px rgba(100,180,255,1),0 0 48px rgba(100,180,255,.8),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{position:relative;font-size:12px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.7);margin-top:6px;opacity:0;transform:translateY(8px);}

  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}}
  @keyframes fxSub  {0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}78%{opacity:1}100%{opacity:0}}
  @keyframes rise{0%{transform:translateY(60px) scale(.88);opacity:0;filter:blur(2px)}100%{transform:translateY(0);opacity:1;filter:none}}
  @keyframes fallUp{0%{opacity:1}40%{opacity:.5}100%{transform:translateY(-60px) scale(.82);opacity:0;filter:blur(3px)}}
  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowBlue{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(100,180,255,.65),0 0 42px rgba(100,180,255,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(100,180,255,.9) ,0 0 58px rgba(100,180,255,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}33%,66%{filter:brightness(.45);opacity:.25}}

  .inline-log{margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px;display:flex;flex-direction:column;gap:7px;}
  .info-box{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);font-size:14px;line-height:1.6;color:var(--text);}
  .info-box strong{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
  .info-flow{font-size:11px;color:rgba(158,178,208,.45);text-align:center;padding:2px 0;}
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">
  <div class="top">
    <div class="title">退化</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="area-label">相手のバトルエリア</div>
    <div class="battle-row">
      <div class="stack-wrap">
        <div class="stack-label">相手</div>
        <div class="stack-slot">
          <div class="scard" id="eHiya"><img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-002.png" alt="ヒヤリモン"></div>
          <div class="scard" id="eBuru"><img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-016.png" alt="ブルコモン"></div>
          <div class="scard" id="ePale"><img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-020.png" alt="ペイルドラモン"></div>
          <div class="scard" id="eCris"><img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-021.png" alt="クリスペイルドラモン"></div>
          <div class="scard" id="eHexe"><img src="https://tayu02.github.io/digimon-keyword/digimon/EX7-023.png" alt="ヘクセブラウモン"></div>
        </div>
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <div class="area-label">自分のバトルエリア</div>
    <div class="battle-row">
      <div class="my-slot">
        <div class="digi-card" id="belzeCard" style="opacity:0">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/EX6-056.png" alt="ベルゼブモン">
        </div>
      </div>
    </div>

    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">退化</div>
      <div class="fx-sub"  id="fxSub">DEDIGIVOLVE</div>
    </div>

    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">ベルゼブモン登場 → 退化2 → ヘクセブラウモン＋クリスペイルドラモンをトラッシュ → ペイルドラモンが最上</div>
    </div>
  </div>
</div></div>

<script>
const board     = document.getElementById("board");
const belzeCard = document.getElementById("belzeCard");
const eHexe     = document.getElementById("eHexe");
const eCris     = document.getElementById("eCris");
const ePale     = document.getElementById("ePale");
const eBuru     = document.getElementById("eBuru");
const eHiya     = document.getElementById("eHiya");
const fxOverlay = document.getElementById("fxOverlay");
const fxBg      = document.getElementById("fxBg");
const fxRing    = document.getElementById("fxRing");
const fxWord    = document.getElementById("fxWord");
const fxSub     = document.getElementById("fxSub");
const infoBox   = document.getElementById("infoBox");
const infoTitle = document.getElementById("infoTitle");
const infoText  = document.getElementById("infoText");
const nextBtn   = document.getElementById("nextBtn");
const prevBtn   = document.getElementById("prevBtn");
const playBtn   = document.getElementById("playBtn");
const resetBtn  = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 4;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const GOLD = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const BLUE = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(100,180,255,.7),0 0 44px rgba(100,180,255,.35),0 10px 20px rgba(0,0,0,.42)";
const RED  = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";

const steps = [
  { title:"① 初期状態・ベルゼブモン登場",
    text :"相手のバトルエリアにはヘクセブラウモンがいます。進化元にはクリスペイルドラモン・ペイルドラモン・ブルコモン・ヒヤリモンがいます。自分のバトルエリアにベルゼブモンが登場します。" },
  { title:"② 退化2発動",
    text :"ベルゼブモンの登場時効果で退化2を相手のデジモンに与えます。ヘクセブラウモンとクリスペイルドラモンがトラッシュに送られ、ペイルドラモンが最上になります。退化は消滅ではないので消滅時効果は発動しません。" },
  { title:"③ 退化1を選んだ場合",
    text :"退化は「2まで選べる」効果なので、1を選ぶこともできます。この場合、ヘクセブラウモンだけがトラッシュに送られ、クリスペイルドラモンが最上になります。" },
  { title:"④ 退化と消滅の違い",
    text :"退化は消滅ではありません。そのため、トラッシュに送られたカードの消滅時効果は発動しません。退化2でヘクセブラウモンとクリスペイルドラモンがトラッシュに送られても、それぞれの消滅時効果は使えません。" },
];

// スタックを初期状態にリセット
function resetStack() {
  eHexe.style.opacity    = "1";
  eHexe.style.animation  = "none";
  eHexe.style.boxShadow  = "";
  eHexe.style.top        = "0px";
  eHexe.style.filter     = "";
  eCris.style.opacity    = "1";
  eCris.style.animation  = "none";
  eCris.style.boxShadow  = "";
  eCris.style.top        = "18px";
  eCris.style.filter     = "brightness(.90)";
  ePale.style.opacity    = "1";
  ePale.style.animation  = "none";
  ePale.style.boxShadow  = "";
  ePale.style.top        = "36px";
  ePale.style.filter     = "brightness(.80)";
  eBuru.style.opacity    = "1";
  eBuru.style.animation  = "none";
  eBuru.style.boxShadow  = "";
  eBuru.style.top        = "54px";
  eBuru.style.filter     = "brightness(.68)";
  eHiya.style.opacity    = "1";
  eHiya.style.animation  = "none";
  eHiya.style.boxShadow  = "";
  eHiya.style.top        = "72px";
  eHiya.style.filter     = "brightness(.55)";
}

function resetAll() {
  resetStack();
  belzeCard.style.opacity   = "0";
  belzeCard.style.animation = "none";
  belzeCard.style.boxShadow = "";
  fxOverlay.style.opacity   = "0";
}

const S = [
  // 0: ベルゼブモン登場・初期スタック
  () => {
    resetAll();
    belzeCard.style.opacity   = "1";
    belzeCard.style.animation = "glowGold 1.4s ease infinite";
    belzeCard.style.boxShadow = GOLD;
    eHexe.style.animation     = "glowGold 1.4s ease infinite";
    eHexe.style.boxShadow     = GOLD;
  },
  // 1: 退化2後・ヘクセ＋クリス消えてペイルが最上
  () => {
    resetAll();
    belzeCard.style.opacity   = "1";
    belzeCard.style.animation = "glowBlue 1.4s ease infinite";
    belzeCard.style.boxShadow = BLUE;
    eHexe.style.opacity       = "0";
    eCris.style.opacity       = "0";
    // ペイルドラモンが最上に
    ePale.style.top           = "0px";
    ePale.style.filter        = "";
    ePale.style.animation     = "glowGold 1.4s ease infinite";
    ePale.style.boxShadow     = GOLD;
    eBuru.style.top           = "18px";
    eBuru.style.filter        = "brightness(.85)";
    eHiya.style.top           = "36px";
    eHiya.style.filter        = "brightness(.70)";
  },
  // 2: 退化1後・ヘクセだけ消えてクリスが最上
  () => {
    resetAll();
    belzeCard.style.opacity   = "1";
    belzeCard.style.animation = "glowBlue 1.4s ease infinite";
    belzeCard.style.boxShadow = BLUE;
    eHexe.style.opacity       = "0";
    // クリスペイルドラモンが最上に
    eCris.style.top           = "0px";
    eCris.style.filter        = "";
    eCris.style.animation     = "glowGold 1.4s ease infinite";
    eCris.style.boxShadow     = GOLD;
    ePale.style.top           = "18px";
    ePale.style.filter        = "brightness(.85)";
    eBuru.style.top           = "36px";
    eBuru.style.filter        = "brightness(.70)";
    eHiya.style.top           = "54px";
    eHiya.style.filter        = "brightness(.55)";
  },
  // 3: 退化2の状態で消滅時効果が発動しない説明
  () => {
    resetAll();
    belzeCard.style.opacity   = "1";
    belzeCard.style.animation = "glowBlue 1.4s ease infinite";
    belzeCard.style.boxShadow = BLUE;
    eHexe.style.opacity       = "0";
    eCris.style.opacity       = "0";
    ePale.style.top           = "0px";
    ePale.style.filter        = "";
    ePale.style.animation     = "glowGold 1.4s ease infinite";
    ePale.style.boxShadow     = GOLD;
    eBuru.style.top           = "18px";
    eBuru.style.filter        = "brightness(.85)";
    eHiya.style.top           = "36px";
    eHiya.style.filter        = "brightness(.70)";
  },
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFxAnim() {
  fxOverlay.style.opacity = "1";
  [fxBg,fxRing,fxWord,fxSub].forEach(el=>{el.style.animation="none";void el.offsetWidth;});
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) {
    // ベルゼブモンがriseで登場
    belzeCard.style.opacity   = "1";
    belzeCard.style.transform = "translateY(60px) scale(.88)";
    belzeCard.style.filter    = "blur(2px)";
    belzeCard.style.animation = "none";
    await sleep(30);
    belzeCard.style.animation = "rise .5s ease forwards";
    await sleep(520);
    belzeCard.style.filter    = "none";
    belzeCard.style.transform = "";
    S[0](); return;
  }

  if (step === 1) {
    // 退化エフェクト→ヘクセ点滅→fallUp→クリス点滅→fallUp→ペイルが最上に
    await playFxAnim();
    eHexe.style.animation = "blink .6s linear 1";
    eHexe.style.boxShadow = RED;
    await sleep(620);
    eHexe.style.animation = "fallUp .5s ease forwards";
    await sleep(300);
    eCris.style.animation = "blink .6s linear 1";
    eCris.style.boxShadow = RED;
    await sleep(620);
    eCris.style.animation = "fallUp .5s ease forwards";
    await sleep(520);
    // スタックを詰める
    ePale.style.top = "0px"; ePale.style.filter = "";
    eBuru.style.top = "18px"; eBuru.style.filter = "brightness(.85)";
    eHiya.style.top = "36px"; eHiya.style.filter = "brightness(.70)";
    S[1](); return;
  }

  if (step === 2) {
    // 退化1：ヘクセだけfallUp→クリスが最上に
    await playFxAnim();
    eHexe.style.animation = "blink .6s linear 1";
    eHexe.style.boxShadow = RED;
    await sleep(620);
    eHexe.style.animation = "fallUp .5s ease forwards";
    await sleep(520);
    eCris.style.top = "0px"; eCris.style.filter = "";
    ePale.style.top = "18px"; ePale.style.filter = "brightness(.85)";
    eBuru.style.top = "36px"; eBuru.style.filter = "brightness(.70)";
    eHiya.style.top = "54px"; eHiya.style.filter = "brightness(.55)";
    S[2](); return;
  }

  if (step === 3) { S[3](); return; }
}

async function goTo(step, instant = false) {
  cur = step; updateText(); updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  if (locked || cur >= TOTAL - 1) return;
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  if (locked || playing || cur >= TOTAL - 1) return;
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800); if (!playing) break;
    locked = true; await goTo(cur + 1, false); locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

goTo(0, true);
</script>
</body>
</html>
