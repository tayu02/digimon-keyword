<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>アーマー解除</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .enemy-area{
    display:flex;justify-content:center;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
  }
  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}
  .my-area{display:flex;justify-content:center;padding:10px 0 4px}

  /* スタック用スロット */
  .slot{
    width:108px;height:200px;
    position:relative;flex:0 0 auto;
  }
  .slot-enemy{
    width:108px;height:151px;
    position:relative;flex:0 0 auto;
  }
  .card{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease, opacity .3s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .enemy .card img{transform:rotate(180deg)}

  /* 矢印SVG */
  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* アーマー解除エフェクト（金白） */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(255,220,80,.2) 0%,rgba(255,220,80,.08) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(255,220,80,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(20px,6vw,36px);font-weight:900;
    letter-spacing:.08em;color:#fff;
    text-shadow:0 0 24px rgba(255,220,80,1),0 0 48px rgba(255,220,80,.8),0 0 80px rgba(255,220,80,.5),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }
  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }
  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }
  @keyframes fallUp{
    0%  {opacity:1;filter:none}
    40% {opacity:.5}
    100%{transform:translateY(-60px) scale(.82);opacity:0;filter:blur(3px)}
  }
  @keyframes fallUpRest{
    /* マグナモンX抗体はレスト状態なのでrotate込み */
    0%  {opacity:1;filter:none;transform:translateY(-22px) rotate(90deg)}
    40% {opacity:.5}
    100%{transform:translateY(-82px) rotate(90deg) scale(.82);opacity:0;filter:blur(3px)}
  }

  .inline-log{
    margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">アーマー解除</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア -->
    <div class="area-label">相手のバトルエリア</div>
    <div class="enemy-area">
      <div class="slot-enemy enemy">
        <div class="card" id="alphaCard">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT9-111.png" alt="">
        </div>
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area">
      <div class="slot" id="mySlot">
        <!-- ブイモン（最下） -->
        <div class="card" id="vuiCard" style="transform:translateY(28px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT3-021.png" alt="">
        </div>
        <!-- マグナモン（中） -->
        <div class="card" id="magnaCard" style="transform:translateY(14px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/ST17-13.png" alt="">
        </div>
        <!-- マグナモンX抗体（最上・レスト） -->
        <div class="card" id="magnaXCard" style="transform:translateY(-22px) rotate(90deg)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT16-102.png" alt="">
        </div>
      </div>
    </div>

    <!-- 矢印SVG -->
    <svg class="arrow-layer" id="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="mhR" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
          <polygon points="0 0,5 2,0 4" fill="rgba(255,91,91,.96)"/>
        </marker>
      </defs>
      <!-- アルファモン→マグナモンX抗体 -->
      <line id="arrMagnaX"
        stroke="rgba(255,91,91,.9)" stroke-width="1.4"
        marker-end="url(#mhR)" opacity="0" style="transition:opacity .3s ease"/>
    </svg>

    <!-- アーマー解除エフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">アーマー解除</div>
      <div class="fx-sub"  id="fxSub">ARMOR PURGE</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        バトル → DP負け → アーマー解除発動 → 最上段のみトラッシュ → 進化元は残る
      </div>
    </div>
  </div>

</div></div>

<script>
const board      = document.getElementById("board");
const alphaCard  = document.getElementById("alphaCard");
const magnaXCard = document.getElementById("magnaXCard");
const magnaCard  = document.getElementById("magnaCard");
const vuiCard    = document.getElementById("vuiCard");
const arrMagnaX  = document.getElementById("arrMagnaX");
const fxOverlay  = document.getElementById("fxOverlay");
const fxBg       = document.getElementById("fxBg");
const fxRing     = document.getElementById("fxRing");
const fxWord     = document.getElementById("fxWord");
const fxSub      = document.getElementById("fxSub");
const infoBox    = document.getElementById("infoBox");
const infoTitle  = document.getElementById("infoTitle");
const infoText   = document.getElementById("infoText");
const nextBtn    = document.getElementById("nextBtn");
const prevBtn    = document.getElementById("prevBtn");
const playBtn    = document.getElementById("playBtn");
const resetBtn   = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 4;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// カード定位置
const POS = {
  vui    : "translateY(28px)",
  magna  : "translateY(14px)",
  magnaX : "translateY(-22px) rotate(90deg)",
  // アーマー解除後：マグナモンがレスト（X抗体がレスト状態だったため）
  magnaRest: "translateY(6px) rotate(90deg)",
  // アルファモンのレスト（相手なので逆向き）
  alphaRest: "rotate(-90deg)",
};

const GOLD = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const RED  = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";

const steps = [
  { title:"① 初期状態",
    text :"マグナモンX抗体がレスト状態でバトルエリアにいます。進化元にはマグナモンとブイモンがいます。相手のバトルエリアにはアルファモン:王竜剣がアクティブ状態です。" },
  { title:"② バトル・DP負け",
    text :"アルファモン:王竜剣がマグナモンX抗体にアタックを宣言しました。DPはアルファモン:王竜剣の方が高く、マグナモンX抗体はバトルで負けます。" },
  { title:"③ アーマー解除発動",
    text :"アーマー解除が発動します。マグナモンX抗体だけがトラッシュへ送られます。進化元のマグナモンとブイモンはバトルエリアにそのまま残ります。マグナモンX抗体がレスト状態だったため、その下のマグナモンもレスト状態になります。" },
  { title:"④ 注意点",
    text :"アーマー解除は消滅ではなくトラッシュへ送る効果のため、消滅時効果は発動しません。また、バトル以外の消滅にも反応してアーマー解除は発動できます。" },
];

// 矢印座標をDOMから動的計算
function updateArrows() {
  const br = board.getBoundingClientRect();
  const ar = alphaCard.getBoundingClientRect();
  const xr = magnaXCard.getBoundingClientRect();
  const ax = ((ar.left + ar.width  / 2) - br.left) / br.width  * 100;
  const ay = ((ar.top  + ar.height / 2) - br.top)  / br.height * 100;
  const xx = ((xr.left + xr.width  / 2) - br.left) / br.width  * 100;
  const xy = ((xr.top  + xr.height / 2) - br.top)  / br.height * 100;
  arrMagnaX.setAttribute("x1", ax); arrMagnaX.setAttribute("y1", ay);
  arrMagnaX.setAttribute("x2", xx); arrMagnaX.setAttribute("y2", xy);
}

function resetCards() {
  magnaXCard.style.transform = POS.magnaX;
  magnaXCard.style.opacity   = "1";
  magnaXCard.style.animation = "none";
  magnaXCard.style.boxShadow = "";
  magnaXCard.style.filter    = "none";
  magnaCard.style.transform  = POS.magna;
  magnaCard.style.opacity    = "1";
  magnaCard.style.animation  = "none";
  magnaCard.style.boxShadow  = "";
  magnaCard.style.filter     = "none";
  vuiCard.style.transform    = POS.vui;
  vuiCard.style.opacity      = "1";
  vuiCard.style.animation    = "none";
  vuiCard.style.boxShadow    = "";
  vuiCard.style.filter       = "none";
  alphaCard.style.transform  = "";
  alphaCard.style.animation  = "none";
  alphaCard.style.boxShadow  = "";
  alphaCard.style.filter     = "none";
  fxOverlay.style.opacity    = "0";
  arrMagnaX.style.opacity    = "0";
}

const S = [
  // 0: 初期状態
  () => {
    resetCards();
    magnaXCard.style.animation = "glowGold 1.4s ease infinite";
    magnaXCard.style.boxShadow = GOLD;
  },
  // 1: アルファモンレスト・矢印→マグナモンX抗体・両方点滅
  () => {
    resetCards();
    alphaCard.style.transform  = POS.alphaRest;
    alphaCard.style.animation  = "glowRed 1.4s ease infinite";
    alphaCard.style.boxShadow  = RED;
    magnaXCard.style.animation = "glowGold 1.4s ease infinite";
    magnaXCard.style.boxShadow = GOLD;
    requestAnimationFrame(() => { updateArrows(); arrMagnaX.style.opacity = "1"; });
  },
  // 2: アーマー解除後・マグナモンX抗体消滅・マグナモンがレスト状態で残る
  () => {
    resetCards();
    alphaCard.style.transform  = POS.alphaRest;
    alphaCard.style.animation  = "none";
    alphaCard.style.boxShadow  = "";
    magnaXCard.style.opacity   = "0";
    magnaCard.style.transform  = POS.magnaRest;
    magnaCard.style.animation  = "glowGold 1.4s ease infinite";
    magnaCard.style.boxShadow  = GOLD;
    vuiCard.style.transform    = POS.vui;
  },
  // 3: 注意点（状態維持）
  () => {
    resetCards();
    alphaCard.style.transform  = POS.alphaRest;
    alphaCard.style.animation  = "none";
    alphaCard.style.boxShadow  = "";
    magnaXCard.style.opacity   = "0";
    magnaCard.style.transform  = POS.magnaRest;
    magnaCard.style.animation  = "glowGold 1.4s ease infinite";
    magnaCard.style.boxShadow  = GOLD;
    vuiCard.style.transform    = POS.vui;
  },
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // アルファモンがレスト→矢印→両方点滅
    alphaCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    alphaCard.style.transform  = POS.alphaRest;
    await sleep(520);
    alphaCard.style.transition = "";
    requestAnimationFrame(() => { updateArrows(); arrMagnaX.style.opacity = "1"; });
    await sleep(200);
    alphaCard.style.animation  = "blink .8s linear 1";
    magnaXCard.style.animation = "blink .8s linear 1";
    await sleep(820);
    S[1]();
    return;
  }

  if (step === 2) {
    // アーマー解除エフェクト→マグナモンX抗体がfallUp→マグナモンがレストへ
    await playFx();
    arrMagnaX.style.opacity    = "0";
    magnaXCard.style.animation = "fallUpRest .5s ease forwards";
    await sleep(520);
    magnaXCard.style.opacity = "0";
    // マグナモンがレスト位置へ
    magnaCard.style.transition = "transform .5s cubic-bezier(.4,0,.2,1)";
    magnaCard.style.transform  = POS.magnaRest;
    await sleep(520);
    magnaCard.style.transition = "";
    S[2]();
    return;
  }

  if (step === 3) { S[3](); return; }
}

async function goTo(step, instant = false) {
  cur = step;
  updateText();
  updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || cur >= TOTAL - 1) return;
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || playing || cur >= TOTAL - 1) return;
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800);
    if (!playing) break;
    locked = true;
    await goTo(cur + 1, false);
    locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

window.addEventListener("resize", () => { if (cur === 1) updateArrows(); });
goTo(0, true);
</script>
</body>
</html>
