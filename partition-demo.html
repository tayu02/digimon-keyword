<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>パーティション</title>
<style>
  :root{ --bg:#08111f; --text:#e9f1ff; --muted:#9eb2d0; --gold:#ffd56a; }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at top,#18263f,var(--bg) 62%);
    color:var(--text);overflow-x:hidden;
  }
  .wrap{min-height:100%;padding:12px;display:grid;place-items:center}
  .scene{
    width:min(700px,100%);
    background:rgba(10,18,32,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
  }
  .top{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .title{font-size:17px;font-weight:800}
  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button{
    border:0;border-radius:10px;padding:5px 6px;min-height:26px;
    font-weight:700;font-size:13px;cursor:pointer;
    color:var(--text);background:#2a3d63;transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:linear-gradient(90deg,#ff6a6a,#ff9c6a)}

  .board{
    background:rgba(17,27,46,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:12px;
    position:relative;overflow:hidden;
  }
  .area-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }

  /* 相手エリア（オプションカード） */
  .enemy-area{
    display:flex;justify-content:center;
    padding:8px 0 10px;
    border-bottom:1px dashed rgba(255,255,255,.1);
    min-height:60px;
    align-items:center;
  }

  /* オプションカード */
  .option-card{
    width:108px;height:151px;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    opacity:0;
    transition:opacity .3s ease, box-shadow .3s ease;
    flex:0 0 auto;
  }
  .option-card img{width:100%;height:100%;object-fit:cover;display:block;transform:rotate(180deg)}

  .divider{text-align:center;font-size:11px;color:rgba(158,178,208,.35);padding:5px 0}

  /* 自分エリア：スタック＋登場後の2カード */
  .my-area{
    display:flex;justify-content:center;gap:20px;
    padding:10px 0 4px;
    align-items:flex-start;
    min-height:0;
  }

  /* スタックスロット */
  .slot{
    width:108px;height:190px;
    position:relative;flex:0 0 auto;
  }
  /* 登場後の単体カード用スロット */
  .slot-single{
    width:108px;height:151px;
    position:relative;flex:0 0 auto;
  }
  .card{
    position:absolute;
    width:108px;height:151px;
    left:0;top:0;
    border-radius:12px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 20px rgba(0,0,0,.42);
    background:#09111f;
    transform-origin:center center;
    transition:box-shadow .3s ease, filter .25s ease, opacity .3s ease;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}

  /* 矢印SVG */
  .arrow-layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    pointer-events:none;z-index:10;
    overflow:visible;
  }

  /* パーティションエフェクト（黄緑・分裂イメージ） */
  .fx-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .fx-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(100,255,180,.2) 0%,rgba(100,255,180,.08) 45%,transparent 72%);
    opacity:0;
  }
  .fx-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(100,255,180,.95);opacity:0;
  }
  .fx-word{
    position:relative;
    font-size:clamp(24px,7vw,42px);font-weight:900;
    letter-spacing:.1em;color:#fff;
    text-shadow:0 0 24px rgba(100,255,180,1),0 0 48px rgba(100,255,180,.8),0 0 80px rgba(100,255,180,.5),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .fx-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.2em;color:rgba(255,255,255,.7);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }

  /* 犬猿の凶弾エフェクト（赤） */
  .kenyen-overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:20;opacity:0;
  }
  .kenyen-bg{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center,
      rgba(255,60,60,.2) 0%,rgba(255,60,60,.08) 45%,transparent 72%);
    opacity:0;
  }
  .kenyen-ring{
    position:absolute;width:56px;height:56px;
    border-radius:50%;border:2px solid rgba(255,60,60,.95);opacity:0;
  }
  .kenyen-word{
    position:relative;
    font-size:clamp(18px,5vw,32px);font-weight:900;
    letter-spacing:.06em;color:#fff;
    text-shadow:0 0 24px rgba(255,60,60,1),0 0 48px rgba(255,60,60,.8),0 2px 8px rgba(0,0,0,1);
    opacity:0;transform:scale(.65);
  }
  .kenyen-sub{
    position:relative;font-size:12px;font-weight:700;
    letter-spacing:.1em;color:rgba(255,180,180,.9);
    margin-top:6px;opacity:0;transform:translateY(8px);
  }

  @keyframes fxBg  {0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes fxRing {0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4)}}
  @keyframes fxWord {
    0%{opacity:0;transform:scale(.65)}18%{opacity:1;transform:scale(1.1)}
    32%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1)}
  }
  @keyframes fxSub{
    0%{opacity:0;transform:translateY(8px)}22%{opacity:1;transform:translateY(0)}
    78%{opacity:1}100%{opacity:0}
  }
  @keyframes rise{
    0%{transform:translateY(80px) scale(.88);opacity:0;filter:blur(2px)}
    100%{transform:translateY(0);opacity:1;filter:none}
  }
  @keyframes fall{
    0%{opacity:1;filter:none}
    40%{opacity:.5}
    100%{transform:translateY(-60px) scale(.82);opacity:0;filter:blur(3px)}
  }
  @keyframes fallRest{
    0%{opacity:1;filter:none;transform:translateY(-22px) rotate(90deg)}
    40%{opacity:.5}
    100%{transform:translateY(-82px) rotate(90deg) scale(.82);opacity:0;filter:blur(3px)}
  }
  @keyframes glowGold{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,214,106,.65),0 0 42px rgba(255,214,106,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,214,106,.9) ,0 0 58px rgba(255,214,106,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowGreen{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(100,255,180,.65),0 0 42px rgba(100,255,180,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(100,255,180,.9) ,0 0 58px rgba(100,255,180,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes glowRed{
    0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 0 20px rgba(255,91,91,.65),0 0 42px rgba(255,91,91,.3),0 10px 20px rgba(0,0,0,.42)}
    50%    {box-shadow:0 0 0 3px rgba(255,255,255,.2) ,0 0 32px rgba(255,91,91,.9) ,0 0 58px rgba(255,91,91,.48),0 10px 20px rgba(0,0,0,.42)}
  }
  @keyframes blink{
    0%,100%{filter:brightness(1.8) saturate(1.3);opacity:1}
    33%,66%{filter:brightness(.45);opacity:.25}
  }

  .inline-log{
    margin-top:14px;border-top:1px solid rgba(255,255,255,.08);
    padding-top:10px;display:flex;flex-direction:column;gap:7px;
  }
  .info-box{
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    font-size:14px;line-height:1.6;color:var(--text);
  }
  .info-box strong{
    display:block;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold);margin-bottom:5px;
  }
  .info-flow{
    font-size:11px;color:rgba(158,178,208,.45);
    text-align:center;padding:2px 0;
  }
  .fade-in{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  @media(min-width:860px){
    .top{flex-direction:row;justify-content:space-between;align-items:center}
    .controls{width:min(340px,100%)}
  }
</style>
</head>
<body>
<div class="wrap"><div class="scene">

  <div class="top">
    <div class="title">パーティション</div>
    <div class="controls">
      <button id="prevBtn">前へ</button>
      <button id="nextBtn" class="primary">次へ</button>
      <button id="playBtn">再生</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="board" id="board">
    <!-- 相手エリア（犬猿の凶弾） -->
    <div class="area-label">相手の使用カード</div>
    <div class="enemy-area">
      <div class="option-card" id="kenyenCard">
        <img src="https://tayu02.github.io/digimon-keyword/digimon/ST14-12.png" alt="犬猿の凶弾">
      </div>
    </div>

    <div class="divider">── VS ──</div>

    <!-- 自分エリア -->
    <div class="area-label">自分のバトルエリア</div>
    <div class="my-area" id="myArea">

      <!-- スタックスロット（初期） -->
      <div class="slot" id="stackSlot">
        <!-- ヴァロドゥルモン（最下） -->
        <div class="card" id="valorCard" style="transform:translateY(28px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT20-043.png" alt="">
        </div>
        <!-- バンチョーレオモン（中） -->
        <div class="card" id="banchoCard" style="transform:translateY(14px)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT20-036.png" alt="">
        </div>
        <!-- カオスモン（最上・レスト） -->
        <div class="card" id="chaosCard" style="transform:translateY(-22px) rotate(90deg)">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT20-037.png" alt="">
        </div>
      </div>

      <!-- パーティション後の登場カード（初期非表示） -->
      <div class="slot-single" id="slotBancho2" style="display:none">
        <div class="card" id="banchoOut" style="opacity:0">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT20-036.png" alt="">
        </div>
      </div>
      <div class="slot-single" id="slotValor2" style="display:none">
        <div class="card" id="valorOut" style="opacity:0">
          <img src="https://tayu02.github.io/digimon-keyword/digimon/BT20-043.png" alt="">
        </div>
      </div>

    </div>

    <!-- 犬猿の凶弾エフェクト -->
    <div class="kenyen-overlay" id="kenyenOverlay">
      <div class="kenyen-bg"   id="kenyenBg"></div>
      <div class="kenyen-ring" id="kenyenRing"></div>
      <div class="kenyen-word" id="kenyenWord">犬猿の凶弾</div>
      <div class="kenyen-sub"  id="kenyenSub">カオスモンを消滅</div>
    </div>

    <!-- パーティションエフェクト -->
    <div class="fx-overlay" id="fxOverlay">
      <div class="fx-bg"   id="fxBg"></div>
      <div class="fx-ring" id="fxRing"></div>
      <div class="fx-word" id="fxWord">パーティション</div>
      <div class="fx-sub"  id="fxSub">PARTITION</div>
    </div>

    <!-- 説明 -->
    <div class="inline-log">
      <div class="info-box" id="infoBox">
        <strong id="infoTitle"></strong>
        <span   id="infoText"></span>
      </div>
      <div class="info-flow">
        犬猿の凶弾発動 → パーティション発動 → 進化元から2体登場 → カオスモン消滅 → 登場時効果
      </div>
    </div>
  </div>

</div></div>

<script>
const board        = document.getElementById("board");
const kenyenCard   = document.getElementById("kenyenCard");
const chaosCard    = document.getElementById("chaosCard");
const banchoCard   = document.getElementById("banchoCard");
const valorCard    = document.getElementById("valorCard");
const slotBancho2  = document.getElementById("slotBancho2");
const slotValor2   = document.getElementById("slotValor2");
const banchoOut    = document.getElementById("banchoOut");
const valorOut     = document.getElementById("valorOut");
const kenyenOverlay= document.getElementById("kenyenOverlay");
const kenyenBg     = document.getElementById("kenyenBg");
const kenyenRing   = document.getElementById("kenyenRing");
const kenyenWord   = document.getElementById("kenyenWord");
const kenyenSub    = document.getElementById("kenyenSub");
const fxOverlay    = document.getElementById("fxOverlay");
const fxBg         = document.getElementById("fxBg");
const fxRing       = document.getElementById("fxRing");
const fxWord       = document.getElementById("fxWord");
const fxSub        = document.getElementById("fxSub");
const infoBox      = document.getElementById("infoBox");
const infoTitle    = document.getElementById("infoTitle");
const infoText     = document.getElementById("infoText");
const nextBtn      = document.getElementById("nextBtn");
const prevBtn      = document.getElementById("prevBtn");
const playBtn      = document.getElementById("playBtn");
const resetBtn     = document.getElementById("resetBtn");

let cur = 0, locked = false, playing = false;
const TOTAL = 4;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const GOLD  = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,214,106,.7),0 0 44px rgba(255,214,106,.35),0 10px 20px rgba(0,0,0,.42)";
const GREEN = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(100,255,180,.7),0 0 44px rgba(100,255,180,.35),0 10px 20px rgba(0,0,0,.42)";
const RED   = "0 0 0 2px rgba(255,255,255,.14),0 0 22px rgba(255,91,91,.7),0 0 44px rgba(255,91,91,.35),0 10px 20px rgba(0,0,0,.42)";

const steps = [
  { title:"① 初期状態",
    text :"カオスモン:ヴァロドゥルアームがレスト状態でバトルエリアにいます。進化元にはバンチョーレオモンとヴァロドゥルモンがいます。相手が犬猿の凶弾を発動しました。" },
  { title:"② 犬猿の凶弾・パーティション発動",
    text :"犬猿の凶弾の効果でカオスモンが消滅対象になります。バトルエリアを離れる際にパーティションが発動します。進化元から条件を満たすカードを登場させます。" },
  { title:"③ 進化元から2体登場",
    text :"バンチョーレオモンとヴァロドゥルモンが進化元からそれぞれ別のバトルエリアに登場します。登場したので登場時効果が発動します。" },
  { title:"④ カオスモン消滅",
    text :"2体を登場させた後、カオスモン:ヴァロドゥルアームが消滅します。パーティションは消滅ではなく「登場させてから消滅」する効果のため、登場時効果は発動しますが、消滅時効果はカオスモンのものが発動します。" },
];

function updateText() {
  const d = steps[cur];
  infoBox.classList.remove("fade-in");
  void infoBox.offsetWidth;
  infoTitle.textContent = d.title;
  infoText.textContent  = d.text;
  infoBox.classList.add("fade-in");
}
function updateBtns() {
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === TOTAL - 1;
  playBtn.disabled = cur === TOTAL - 1;
}

async function playKenyen() {
  kenyenOverlay.style.opacity = "1";
  [kenyenBg, kenyenRing, kenyenWord, kenyenSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  kenyenBg.style.animation   = "fxBg   1.4s ease forwards";
  kenyenRing.style.animation = "fxRing .85s ease-out forwards";
  kenyenWord.style.animation = "fxWord 1.4s ease forwards";
  kenyenSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  kenyenOverlay.style.opacity = "0";
}

async function playFx() {
  fxOverlay.style.opacity = "1";
  [fxBg, fxRing, fxWord, fxSub].forEach(el => { el.style.animation = "none"; void el.offsetWidth; });
  fxBg.style.animation   = "fxBg   1.4s ease forwards";
  fxRing.style.animation = "fxRing .85s ease-out forwards";
  fxWord.style.animation = "fxWord 1.4s ease forwards";
  fxSub.style.animation  = "fxSub  1.4s ease forwards";
  await sleep(1450);
  fxOverlay.style.opacity = "0";
}

// 全リセット
function resetAll() {
  kenyenCard.style.opacity   = "0";
  kenyenOverlay.style.opacity= "0";
  fxOverlay.style.opacity    = "0";
  document.getElementById("stackSlot").style.display = "flex";
  document.getElementById("myArea").style.minHeight  = "";
  // スタック
  chaosCard.style.transform  = "translateY(-22px) rotate(90deg)";
  chaosCard.style.opacity    = "1";
  chaosCard.style.animation  = "none";
  chaosCard.style.boxShadow  = "";
  banchoCard.style.transform = "translateY(14px)";
  banchoCard.style.opacity   = "1";
  banchoCard.style.animation = "none";
  banchoCard.style.boxShadow = "";
  valorCard.style.transform  = "translateY(28px)";
  valorCard.style.opacity    = "1";
  valorCard.style.animation  = "none";
  valorCard.style.boxShadow  = "";
  // 登場後スロット
  slotBancho2.style.display  = "none";
  slotValor2.style.display   = "none";
  banchoOut.style.opacity    = "0";
  valorOut.style.opacity     = "0";
  banchoOut.style.animation  = "none";
  valorOut.style.animation   = "none";
  banchoOut.style.boxShadow  = "";
  valorOut.style.boxShadow   = "";
}

const S = [
  // 0: 初期状態・凶弾なし
  () => {
    resetAll();
    chaosCard.style.animation = "glowGold 1.4s ease infinite";
    chaosCard.style.boxShadow = GOLD;
  },
  // 1: 犬猿エフェクト後（カオスモン赤く光る）
  () => {
    resetAll();
    kenyenCard.style.opacity  = "1";
    chaosCard.style.animation = "glowRed 1.4s ease infinite";
    chaosCard.style.boxShadow = RED;
  },
  // 2: 進化元2体が登場（スタックから独立）
  () => {
    resetAll();
    kenyenCard.style.opacity   = "1";
    chaosCard.style.animation  = "glowGold 1.4s ease infinite";
    chaosCard.style.boxShadow  = GOLD;
    banchoCard.style.opacity   = "0";
    valorCard.style.opacity    = "0";
    slotBancho2.style.display  = "flex";
    slotValor2.style.display   = "flex";
    banchoOut.style.opacity    = "1";
    valorOut.style.opacity     = "1";
    banchoOut.style.animation  = "glowGreen 1.4s ease infinite";
    valorOut.style.animation   = "glowGreen 1.4s ease infinite";
    banchoOut.style.boxShadow  = GREEN;
    valorOut.style.boxShadow   = GREEN;
  },
  // 3: カオスモン消滅・凶弾も消える・スタックスロット詰める
  () => {
    kenyenCard.style.opacity   = "0";
    kenyenOverlay.style.opacity= "0";
    fxOverlay.style.opacity    = "0";
    chaosCard.style.opacity    = "0";
    banchoCard.style.opacity   = "0";
    valorCard.style.opacity    = "0";
    document.getElementById("stackSlot").style.display = "none";
    document.getElementById("myArea").style.minHeight  = "0";
    slotBancho2.style.display  = "flex";
    slotValor2.style.display   = "flex";
    banchoOut.style.opacity    = "1";
    banchoOut.style.transform  = "";
    banchoOut.style.filter     = "none";
    valorOut.style.opacity     = "1";
    valorOut.style.transform   = "";
    valorOut.style.filter      = "none";
    banchoOut.style.animation  = "glowGreen 1.4s ease infinite";
    valorOut.style.animation   = "glowGreen 1.4s ease infinite";
    banchoOut.style.boxShadow  = GREEN;
    valorOut.style.boxShadow   = GREEN;
  },
];

async function runAnim(step) {
  if (step === 0) { S[0](); return; }

  if (step === 1) {
    // 凶弾カードがriseで登場
    kenyenCard.style.opacity   = "1";
    kenyenCard.style.transform = "translateY(60px) scale(.88)";
    kenyenCard.style.filter    = "blur(2px)";
    await sleep(30);
    kenyenCard.style.transition = "transform .45s cubic-bezier(.4,0,.2,1), filter .35s ease, opacity .3s ease";
    kenyenCard.style.transform  = "";
    kenyenCard.style.filter     = "none";
    await sleep(460);
    kenyenCard.style.transition = "";
    await sleep(200);
    // 犬猿の凶弾エフェクト→パーティション発動
    await playKenyen();
    chaosCard.style.animation = "blink .8s linear 1";
    chaosCard.style.boxShadow = RED;
    await sleep(820);
    await playFx();
    S[1]();
    return;
  }

  if (step === 2) {
    // バンチョーレオモンとヴァロドゥルモンが順番に登場
    slotBancho2.style.display = "flex";
    banchoOut.style.opacity   = "1";
    banchoOut.style.transform = "translateY(80px) scale(.88)";
    banchoOut.style.filter    = "blur(2px)";
    banchoOut.style.animation = "none";
    await sleep(30);
    banchoOut.style.animation = "rise .5s ease forwards";
    banchoCard.style.opacity  = "0";
    await sleep(520);
    banchoOut.style.filter    = "none";

    slotValor2.style.display  = "flex";
    valorOut.style.opacity    = "1";
    valorOut.style.transform  = "translateY(80px) scale(.88)";
    valorOut.style.filter     = "blur(2px)";
    valorOut.style.animation  = "none";
    await sleep(30);
    valorOut.style.animation  = "rise .5s ease forwards";
    valorCard.style.opacity   = "0";
    await sleep(520);
    valorOut.style.filter     = "none";

    S[2]();
    return;
  }

  if (step === 3) {
    // カオスモンと凶弾が同時にfallで消える
    chaosCard.style.animation = "fallRest .5s ease forwards";
    kenyenCard.style.transition = "opacity .5s ease";
    kenyenCard.style.opacity    = "0";
    await sleep(520);
    kenyenCard.style.transition = "";
    // stackSlotを非表示にしてmy-areaを詰める
    document.getElementById("stackSlot").style.display = "none";
    document.getElementById("myArea").style.minHeight  = "0";
    S[3]();
    return;
  }
}

async function goTo(step, instant = false) {
  cur = step;
  updateText();
  updateBtns();
  if (instant) { S[step](); return; }
  await runAnim(step);
}

nextBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || cur >= TOTAL - 1) return;
  playing = false; locked = true;
  await goTo(cur + 1, false);
  locked = false; updateBtns();
});
prevBtn.addEventListener("click", async () => {
  if (locked || cur <= 0) return;
  playing = false; locked = true;
  await goTo(cur - 1, true);
  locked = false; updateBtns();
});
playBtn.addEventListener("click", async () => {
  document.getElementById("board").scrollIntoView({behavior:"smooth", block:"start"});
  if (locked || playing || cur >= TOTAL - 1) return;
  playing = true;
  while (playing && cur < TOTAL - 1) {
    await sleep(1800);
    if (!playing) break;
    locked = true;
    await goTo(cur + 1, false);
    locked = false; updateBtns();
  }
  playing = false;
});
resetBtn.addEventListener("click", async () => {
  playing = false; locked = false;
  await goTo(0, true); updateBtns();
});

goTo(0, true);
</script>
</body>
